// ---- tiny assertion harness ----

const results = [];
let currentGroup = '';

function group(name) { currentGroup = name; }

function test(name, fn) {
  try {
    fn();
    results.push({ group: currentGroup, name, ok: true, detail: '' });
  } catch (e) {
    results.push({ group: currentGroup, name, ok: false, detail: e && e.message ? e.message : String(e) });
  }
}

/**
 * A test that needs the real SheetJS library. When the CDN is unreachable
 * (offline laptop, blocked network) it is reported as skipped rather than
 * failed, so an offline run still gives a meaningful result.
 */
function testWithXLSX(name, fn) {
  if (!isXLSXAvailable()) {
    results.push({ group: currentGroup, name, ok: true, skipped: true, detail: 'SheetJS was not loaded from the CDN.' });
    return;
  }
  test(name, fn);
}

function fail(message) { throw new Error(message); }

function assert(condition, message) {
  if (!condition) fail(message || 'assertion failed');
}

function assertEqual(actual, expected, message) {
  if (actual !== expected) fail(`${message || 'values differ'}\n  expected: ${expected}\n  actual:   ${actual}`);
}

function assertDeep(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) fail(`${message || 'values differ'}\n  expected: ${b}\n  actual:   ${a}`);
}

// ---- helpers ----

const t = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
};

const avail = (coachName, day, start, end, coachSfId = '', coachEmail = '') => ({
  coachName, coachSfId, coachEmail, day, start: t(start), end: t(end),
});
const cls = (day, start, end, className = 'Class') => ({ day, start: t(start), end: t(end), className });
const students = (n, prefix = 'S') =>
  Array.from({ length: n }, (_, i) => ({
    contactSfId: `${prefix}${i + 1}`,
    studentName: `${prefix}tudent ${i + 1}`,
    studentEmail: `${prefix.toLowerCase()}${i + 1}@example.com`,
  }));

const LONDON = 'Europe/London';
const isoAt = (y, m, d, hhmm, tz) => formatIsoWithOffset(wallClockToInstant(y, m, d, t(hhmm), tz), tz);

const slotLabel = (s) => `${s.coach}/${s.day}/${minutesToTime(s.start)}`;

// Shared fixture used by the mode and invariant tests.
// Coach A: Mon 09:00–12:00 (Mon class 10:00–11:00 removes 3 windows → 09:00, 11:00)
//          Wed 09:00–12:00 (Wed class 09:00–10:00 removes 2 windows → 10:00, 10:30, 11:00)
// Coach B: Tue 09:30–12:30, no classes → 09:30, 10:00, 10:30, 11:00, 11:30
const FIXTURE_CLASSES = [cls('Monday', '10:00', '11:00', 'Maths'), cls('Wednesday', '09:00', '10:00', 'Physics')];
const FIXTURE_AVAILABILITY = [
  avail('Coach A', 'Monday', '09:00', '12:00', 'C-A', 'a@example.com'),
  avail('Coach A', 'Wednesday', '09:00', '12:00', 'C-A', 'a@example.com'),
  avail('Coach B', 'Tuesday', '09:30', '12:30'),
];
const FIXTURE_SLOTS = buildSlots(FIXTURE_AVAILABILITY, FIXTURE_CLASSES);
const START_MONDAY = '2026-09-07'; // a Monday

function slotCountsOf(slots) {
  const counts = {};
  slots.forEach((s) => { counts[s.coach] = (counts[s.coach] || 0) + 1; });
  return counts;
}

// ---- §4.4 valid slot definition ----

group('§4.4 — valid slots');

test('60-minute windows tile an availability block on 30-minute boundaries', () => {
  const slots = buildSlots([avail('C', 'Monday', '09:00', '12:00')], []);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:00', '09:30', '10:00', '10:30', '11:00']);
  assert(slots.every((s) => s.end - s.start === 60), 'every slot is 60 minutes long');
});

test('slots must start on :00 or :30 and fit entirely inside the block', () => {
  const slots = buildSlots([avail('C', 'Monday', '09:15', '10:30')], []);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:30'], 'only 09:30 fits inside 09:15–10:30');
});

test('a block shorter than 60 minutes yields no slots', () => {
  assertEqual(buildSlots([avail('C', 'Monday', '09:00', '09:45')], []).length, 0);
});

test('windows overlapping a class block are excluded; touching ones are kept', () => {
  const slots = buildSlots([avail('C', 'Monday', '09:00', '12:00')], [cls('Monday', '10:00', '11:00')]);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:00', '11:00'],
    '09:30/10:00/10:30 overlap the class; 09:00–10:00 and 11:00–12:00 only touch it');
});

test('a class block on another day does not remove slots', () => {
  const slots = buildSlots([avail('C', 'Monday', '09:00', '11:00')], [cls('Tuesday', '09:00', '17:00')]);
  assertEqual(slots.length, 3);
});

test('slots are ordered by day (Mon→Sun) then start time', () => {
  const slots = buildSlots([
    avail('C', 'Wednesday', '09:00', '10:00'),
    avail('C', 'Monday', '11:00', '12:00'),
    avail('C', 'Monday', '09:00', '10:00'),
  ], []);
  assertDeep(slots.map(slotLabel), ['C/Monday/09:00', 'C/Monday/11:00', 'C/Wednesday/09:00']);
});

test('overlapping availability rows do not produce duplicate slots', () => {
  const slots = buildSlots([
    avail('C', 'Monday', '09:00', '11:00'),
    avail('C', 'Monday', '10:00', '12:00'),
  ], []);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:00', '09:30', '10:00', '10:30', '11:00']);
});

test('Coach ID from the availability file is carried onto slots', () => {
  assertEqual(FIXTURE_SLOTS.find((s) => s.coach === 'Coach A').coachSfId, 'C-A');
  assertEqual(FIXTURE_SLOTS.find((s) => s.coach === 'Coach B').coachSfId, '');
});

test('fixture builds the expected slots for both coaches', () => {
  assertDeep(FIXTURE_SLOTS.map(slotLabel), [

    'Coach A/Monday/11:00',
    'Coach B/Tuesday/09:30',

    'Coach B/Tuesday/11:00',
    'Coach B/Tuesday/11:30',
    'Coach A/Wednesday/10:00',
    'Coach A/Wednesday/10:30',
    'Coach A/Wednesday/11:00',
  ]);
});

// ---- §5.1 quota maths ----

group('§5.1 — FTE quotas');

test('equal FTE splits students evenly', () => {
  const quotas = computeQuotas(['A', 'B'], { A: 1, B: 1 }, 10, { A: 10, B: 10 });
  assertDeep(quotas, { A: 5, B: 5 });
});

test('part-time 0.5 FTE coach gets half the full-time share', () => {
  const quotas = computeQuotas(['A', 'B'], { A: 1, B: 0.5 }, 9, { A: 10, B: 10 });
  assertDeep(quotas, { A: 6, B: 3 }, '9 × (1/1.5) = 6 and 9 × (0.5/1.5) = 3');
});

test('largest remainder awards the leftover student to the larger fraction', () => {
  // 10 × (1/1.5) = 6.67 → 6 r.67; 10 × (0.5/1.5) = 3.33 → 3 r.33; leftover → A.
  assertDeep(computeQuotas(['A', 'B'], { A: 1, B: 0.5 }, 10, { A: 10, B: 10 }), { A: 7, B: 3 });
});

test('quotas always sum to the student count when capacity allows', () => {
  const quotas = computeQuotas(['A', 'B', 'C'], { A: 1, B: 0.5, C: 0.25 }, 17, { A: 10, B: 10, C: 10 });
  assertEqual(Object.values(quotas).reduce((a, b) => a + b, 0), 17);
});

test('quota is capped at capacity (valid slots × 3) and the rest redistributed', () => {
  // A is full-time but has only 1 slot → capacity 3. B (0.5 FTE) absorbs the rest.
  const quotas = computeQuotas(['A', 'B'], { A: 1, B: 0.5 }, 12, { A: 1, B: 10 });
  assertDeep(quotas, { A: 3, B: 9 });
});

test('redistribution respects FTE proportions among coaches with spare capacity', () => {
  // A capped at 3; the remaining 9 students split 1 : 0.5 between B and C → 6 : 3.
  const quotas = computeQuotas(['A', 'B', 'C'], { A: 1, B: 1, C: 0.5 }, 12, { A: 1, B: 10, C: 10 });
  assertDeep(quotas, { A: 3, B: 6, C: 3 });
});

test('total quota never exceeds total capacity', () => {
  const quotas = computeQuotas(['A', 'B'], { A: 1, B: 1 }, 40, { A: 2, B: 3 });
  assertDeep(quotas, { A: 6, B: 9 }, 'capacity is 6 + 9 = 15, well below 40 students');
});

test('a coach with no valid slots receives a zero quota', () => {
  assertDeep(computeQuotas(['A', 'B'], { A: 1, B: 1 }, 6, { A: 0, B: 10 }), { A: 0, B: 6 });
});

test('zero students produces zero quotas', () => {
  assertDeep(computeQuotas(['A', 'B'], { A: 1, B: 1 }, 0, { A: 5, B: 5 }), { A: 0, B: 0 });
});

// ---- §5.1 auto mode ----

group('§5.1 — auto-assign mode');

test('students fill each coach up to quota, slot by slot, offset 1→2→3', () => {
  const slots = buildSlots([avail('A', 'Monday', '09:00', '11:00')], []); // 09:00, 09:30, 10:00
  const { assignments, unassigned } = schedule(students(5), slots, 'auto', { A: 5 });
  assertEqual(unassigned.length, 0);
  assertDeep(
    assignments.map((a) => `${a.student.contactSfId}→${slotLabel(a.slot)}#${a.offset}`),
    ['S1→A/Monday/09:00#1', 'S2→A/Monday/09:00#2', 'S3→A/Monday/09:00#3',
     'S4→A/Monday/09:30#1', 'S5→A/Monday/09:30#2']
  );
});

test('a slot never holds more than 3 students (one per offset)', () => {
  const { assignments } = schedule(students(30), FIXTURE_SLOTS, 'auto',
    computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 1 }, 30, slotCountsOf(FIXTURE_SLOTS)));
  const perSlot = new Map();
  assignments.forEach((a) => {
    const key = slotLabel(a.slot);
    if (!perSlot.has(key)) perSlot.set(key, new Set());
    const offsets = perSlot.get(key);
    assert(!offsets.has(a.offset), `offset ${a.offset} used twice in ${key}`);
    offsets.add(a.offset);
  });
  perSlot.forEach((offsets, key) => assert(offsets.size <= 3, `${key} holds ${offsets.size} students`));
});

test('coaches are filled in coach file order', () => {
  const quotas = computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 0.5 }, 8, slotCountsOf(FIXTURE_SLOTS));
  assertDeep(quotas, { 'Coach A': 5, 'Coach B': 3 });
  const { assignments } = schedule(students(8), FIXTURE_SLOTS, 'auto', quotas);
  assertDeep(assignments.map((a) => a.coach),
    ['Coach A', 'Coach A', 'Coach A', 'Coach A', 'Coach A', 'Coach B', 'Coach B', 'Coach B']);
});

test('surplus students beyond total capacity are unassigned with "insufficient capacity"', () => {
  const slotCounts = slotCountsOf(FIXTURE_SLOTS); // 5 + 5 slots → capacity 30
  const quotas = computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 1 }, 34, slotCounts);
  const { assignments, unassigned } = schedule(students(34), FIXTURE_SLOTS, 'auto', quotas);
  assertEqual(assignments.length, 30, 'capacity is 10 slots × 3');
  assertEqual(unassigned.length, 4);
  assert(unassigned.every((u) => u.reason === REASONS.INSUFFICIENT_CAPACITY), 'reason string is "insufficient capacity"');
  assertEqual(REASONS.INSUFFICIENT_CAPACITY, 'insufficient capacity');
  assertDeep(unassigned.map((u) => u.student.contactSfId), ['S31', 'S32', 'S33', 'S34']);
});

test('identical inputs produce identical output (§4.6 determinism)', () => {
  const args = [students(8), FIXTURE_SLOTS, 'auto',
    computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 0.5 }, 8, slotCountsOf(FIXTURE_SLOTS))];
  const first = schedule(...args);
  const second = schedule(...args);
  const shape = (r) => ({
    assignments: r.assignments.map((a) => `${a.student.contactSfId}|${slotLabel(a.slot)}|${a.offset}`),
    unassigned: r.unassigned.map((u) => `${u.student.contactSfId}|${u.reason}`),
  });
  assertDeep(shape(first), shape(second));
});

// ---- §5.2 pre-allocated mode ----

group('§5.2 — pre-allocated mode');

const PAIRED_STUDENTS = students(4);

test('paired students are assigned to their own coach, offset 1→2→3 per slot', () => {
  const pairings = [
    { contactSfId: 'S1', coachName: 'Coach B' },
    { contactSfId: 'S2', coachName: 'Coach A' },
    { contactSfId: 'S3', coachName: 'Coach B' },
    { contactSfId: 'S4', coachName: 'Coach A' },
  ];
  const { assignments, unassigned } = schedule(PAIRED_STUDENTS, FIXTURE_SLOTS, 'pre-allocated', pairings);
  assertEqual(unassigned.length, 0);
  const byStudent = Object.fromEntries(assignments.map((a) => [a.student.contactSfId, `${slotLabel(a.slot)}#${a.offset}`]));
  assertDeep(byStudent, {
    S1: 'Coach B/Tuesday/09:30#1',
    S3: 'Coach B/Tuesday/09:30#2',
    S2: 'Coach A/Monday/09:00#1',
    S4: 'Coach A/Wednesday/10:00#1',
  }, 'pairings-file order decides who; §4.7 spreads a coach over their own days');
  // Coach B works one day, so both of their students stack in the first slot,
  // offset 1 then 2 — §4.6 order, unchanged. Coach A works Monday and

  // on Monday, which is what this rule is for.
});

test('students missing from the pairings file are unassigned with "no pairing"', () => {
  const pairings = [{ contactSfId: 'S1', coachName: 'Coach A' }];
  const { unassigned } = schedule(students(3), FIXTURE_SLOTS, 'pre-allocated', pairings);
  assertDeep(unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`), ['S2:no pairing', 'S3:no pairing']);
  assertEqual(REASONS.NO_PAIRING, 'no pairing');
});

test('pairings naming an unknown coach are unassigned with "coach not found"', () => {
  const pairings = [
    { contactSfId: 'S1', coachName: 'Coach Z' },
    { contactSfId: 'S2', coachName: 'Coach A' },
  ];
  const { assignments, unassigned } = schedule(students(2), FIXTURE_SLOTS, 'pre-allocated', pairings);
  assertDeep(unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`), ['S1:coach not found']);
  assertEqual(assignments.length, 1);
  assertEqual(REASONS.COACH_NOT_FOUND, 'coach not found');
});

test('a coach with availability but no valid slots is found, not "coach not found"', () => {
  const pairings = [{ contactSfId: 'S1', coachName: 'Coach C' }];
  const { unassigned } = schedule(students(1), FIXTURE_SLOTS, 'pre-allocated', pairings, ['Coach A', 'Coach B', 'Coach C']);
  assertDeep(unassigned.map((u) => u.reason), [REASONS.COACH_OVER_CAPACITY]);
});

test('students beyond a coach capacity are unassigned with "coach over capacity"', () => {
  const slots = buildSlots([avail('A', 'Monday', '09:00', '10:00')], []); // 1 slot → capacity 3
  const all = students(5);
  const pairings = all.map((s) => ({ contactSfId: s.contactSfId, coachName: 'A' }));
  const { assignments, unassigned } = schedule(all, slots, 'pre-allocated', pairings);
  assertEqual(assignments.length, 3);
  assertDeep(assignments.map((a) => a.offset), [1, 2, 3]);
  assertDeep(unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`), ['S4:coach over capacity', 'S5:coach over capacity']);
  assertEqual(REASONS.COACH_OVER_CAPACITY, 'coach over capacity');
});

// ---- §4.7 day-balanced allocation ----

group('§4.7 — day-balanced allocation');

/**
 * Day → how many students a coach took there, in Mon→Sun order. The order the
 * days are *filled* in is §4.7's business (largest deficit first), so the
 * counts are keyed in calendar order to keep these assertions about the spread.
 */
function dayCountsOf(assignments, coach) {
  const counts = new Map();
  assignments
    .filter((a) => !coach || a.coach === coach)
    .forEach((a) => counts.set(a.slot.day, (counts.get(a.slot.day) || 0) + 1));
  const ordered = {};
  DAY_ORDER.filter((day) => counts.has(day)).forEach((day) => { ordered[day] = counts.get(day); });
  return ordered;
}

/** The place each student ended up in, as `day/start#offset`, in student order. */
const placesOf = (assignments) =>
  assignments.map((a) => `${a.slot.day}/${minutesToTime(a.slot.start)}#${a.offset}`);

// The SPEC.md §4.7 worked example: two valid slots on each of four days, so
// each day can hold 6 meetings (§4.5: 3 students per slot, one per offset).
const BAL_AVAILABILITY = ['Monday', 'Tuesday', 'Wednesday', 'Thursday'].map((day) =>
  avail('Coach A', day, '09:00', '10:30', 'C-A', 'a@example.com'));
const BAL_SLOTS = buildSlots(BAL_AVAILABILITY, []);

test('the worked-example fixture really is 2 slots and 6 places per day', () => {
  assertDeep(dayCountsOf(BAL_SLOTS.map((slot) => ({ coach: slot.coach, slot })), 'Coach A'),
    { Monday: 2, Tuesday: 2, Wednesday: 2, Thursday: 2 }, 'two 60-minute windows per day');
  assertDeep(BAL_SLOTS.filter((s) => s.day === 'Monday').map((s) => minutesToTime(s.start)), ['09:00', '09:30']);
});

test('a quota of 10 over four 6-place days is targeted 3/3/2/2, not 6/4/0/0', () => {
  assertDeep(balancedDayTargets(BAL_SLOTS, 10),
    { Monday: 3, Tuesday: 3, Wednesday: 2, Thursday: 2 },
    'largest remainder over four equal days, ties to the earlier day');
});

test('the schedule really does spread 10 students 3/3/2/2 (the §4.7 example)', () => {
  const { assignments, unassigned } = schedule(students(10), BAL_SLOTS, 'auto', { 'Coach A': 10 });
  assertEqual(unassigned.length, 0);
  assertDeep(dayCountsOf(assignments, 'Coach A'), { Monday: 3, Tuesday: 3, Wednesday: 2, Thursday: 2 });
  assert(dayCountsOf(assignments, 'Coach A').Monday !== 6, 'the pre-v1.8 pile-up of 6/4/0/0 is gone');
});

test('within a day the order is unchanged: start time, then offset 1→2→3', () => {
  // 16 students over four days → 4 each, so every day has to move past its
  // first slot and the within-day order is visible.
  const { assignments, unassigned } = schedule(students(16), BAL_SLOTS, 'auto', { 'Coach A': 16 });
  assertEqual(unassigned.length, 0);
  assertDeep(dayCountsOf(assignments, 'Coach A'), { Monday: 4, Tuesday: 4, Wednesday: 4, Thursday: 4 });
  const monday = assignments.filter((a) => a.slot.day === 'Monday');
  assertDeep(monday.map((a) => `${minutesToTime(a.slot.start)}#${a.offset}`),
    ['09:00#1', '09:00#2', '09:00#3', '09:30#1'],
    'the day fills its earliest slot 1→2→3 before opening the next one');
});

test('students are handed out day by day, in the stated tie-break order', () => {
  const { assignments } = schedule(students(10), BAL_SLOTS, 'auto', { 'Coach A': 10 });
  assertDeep(placesOf(assignments), [
    // Round 1: every day has a deficit of 2 or 3, so they go earliest-day first.
    'Monday/09:00#1', 'Tuesday/09:00#1', 'Wednesday/09:00#1', 'Thursday/09:00#1',
    // Monday and Tuesday still have the larger deficit (3 vs 2).
    'Monday/09:00#2', 'Tuesday/09:00#2',
    // All four now sit at a deficit of 1; fewest-so-far puts Wed and Thu first.
    'Wednesday/09:00#2', 'Thursday/09:00#2',
    // Only Monday and Tuesday have anything left to hit their target of 3.
    'Monday/09:00#3', 'Tuesday/09:00#3',
  ]);
});

test('a day target is capped by that day capacity, and the remainder moves', () => {

});

test('balancing is per coach: one coach days never rebalance another coach', () => {

test('a class-block clash sends the student to the day with the largest deficit', () => {
  // Block A is in class all Wednesday morning, so none of Coach A's Wednesday
  // places are usable by them — but they are still usable by Block B, so the
  // windows exist (§4.4a) and Wednesday still gets a target.
  const classes = [
    { classBlock: 'Block A', day: 'Wednesday', start: t('09:00'), end: t('10:30'), className: 'Maths' },
    { classBlock: 'Block B', day: 'Friday', start: t('09:00'), end: t('10:00'), className: 'Physics' },
  ];
  const blocks = buildClassBlocks(classes);
  const slots = buildSlots(['Monday', 'Tuesday', 'Wednesday'].map((day) =>
    avail('Coach A', day, '09:00', '10:30', 'C-A', 'a@example.com')), blocks);
  assertEqual(slots.filter((s) => s.day === 'Wednesday').length, 2, 'the Wednesday windows still exist');
  assertDeep(balancedDayTargets(slots, 6), { Monday: 2, Tuesday: 2, Wednesday: 2 }, 'Wednesday is targeted');

  const blockA = students(6).map((s) => ({ ...s, classBlock: 'Block A' }));
  const { assignments, unassigned } = schedule(blockA, slots, 'auto', { 'Coach A': 6 }, ['Coach A'], { classBlocks: blocks });
  assertEqual(unassigned.length, 0, 'a barred target day costs nobody their place');
  assertDeep(dayCountsOf(assignments, 'Coach A'), { Monday: 3, Tuesday: 3 },
    'Wednesday cannot take its two, so they fall to the days with the largest deficit');
  assert(assignments.every((a) => slotAllowsClassBlock(a.slot, a.student.classBlock)),
    'and nobody is placed during their own class');

  // The same Wednesday hour is still on offer to a cohort that can use it.
  const blockB = students(1, 'B').map((s) => ({ ...s, classBlock: 'Block B' }));
  const mixed = schedule([...blockA, ...blockB], slots, 'auto', { 'Coach A': 9 }, ['Coach A'], { classBlocks: blocks });
  assertEqual(mixed.assignments.find((a) => a.student.contactSfId === 'B1').slot.day, 'Wednesday',
    'Wednesday still has the largest deficit, and Block B can take it');
});

test('balancing never breaks quota, capacity or the unassigned reasons', () => {

test('§11.3 redistribution keeps its own rule and does not re-balance days', () => {
  // One place per day, so a displaced meeting could only "rebalance" by
  // changing day — and §11.3 does not do that: it stays on the same day and
  // time in another week of the same block.
  const slots = buildSlots(['Monday', 'Tuesday'].map((day) =>
    avail('Coach A', day, '09:00', '10:00', 'C-A', 'a@example.com')), []);
  const { assignments } = schedule(students(2), slots, 'auto', { 'Coach A': 2 });
  assertDeep(placesOf(assignments), ['Monday/09:00#1', 'Tuesday/09:00#1'], 'one student per day');

  const rows = expandToAppointments(assignments, START_MONDAY, LONDON);
  const { appointments, exceptions } = applyBlocks(rows, [{ coach: 'Coach A', week: 1 }], slots,
    { timeZone: LONDON, startMonday: START_MONDAY });
  assertEqual(exceptions.length, 0, 'both had somewhere to go');

  const moved = appointments.filter((r) => r.rescheduledFromWeek !== '');
  assertEqual(moved.length, 2, 'both week-1 meetings moved');
  moved.forEach((row) => {
    const original = rows.find((r) => r.contactSfId === row.contactSfId && r.meetingNumber === row.meetingNumber);
    assertEqual(row.day, original.day, `${row.contactSfId} kept their weekday`);
    assertEqual(row.startTime, original.startTime, 'and their start time');
    assertEqual(row.coachName, original.coachName, 'and their coach (§11.3)');
    assertEqual(blockOfWeek(row.weekNumber), blockOfWeek(original.weekNumber), 'and their term block');
  });
});

group('§11.3 — redistribution order');

// One coach, two weekday slots, so each resolution step can be forced.
const BLOCK_SLOTS = buildSlots(
  [avail('Coach A', 'Monday', '09:00', '10:00', 'C-A', 'a@example.com'),
   avail('Coach A', 'Tuesday', '09:00', '10:00', 'C-A', 'a@example.com')],
  []
);
const MON = BLOCK_SLOTS.find((s) => s.day === 'Monday');
const TUE = BLOCK_SLOTS.find((s) => s.day === 'Tuesday');

const assign = (student, slot, offset) => ({ student, coach: slot.coach, slot, offset });
const rowsFor = (assignments) => expandToAppointments(assignments, START_MONDAY, LONDON);
const cellOf = (r) => `${r.coachName}/${r.day}/${r.startTime}/wk${r.weekNumber}`;
const findRow = (rows, id, meeting) => rows.find((r) => r.contactSfId === id && r.meetingNumber === meeting);

test('(1) a displaced meeting keeps its day and time in another week of the block', () => {
  const [s1] = students(1);
  const rows = rowsFor([assign(s1, MON, 1)]); // weeks 1, 5, 9, 13
  const { appointments, exceptions, movedCount } = applyBlocks(rows, [{ coach: 'Coach A', week: 1 }], BLOCK_SLOTS);
  assertEqual(exceptions.length, 0);
  assertEqual(movedCount, 1);
  const moved = findRow(appointments, 'S1', 1);
  assertEqual(cellOf(moved), 'Coach A/Monday/09:00/wk2', 'same slot, next week of block 1');
  assertEqual(moved.rescheduledFromWeek, 1);
  assertEqual(moved.date, '2026-09-14', 'week 2 Monday');
  assertEqual(moved.startDateTime, '2026-09-14T09:00:00+01:00', 'the export instant moves with the row');
});

test('(1) earlier weeks of the block are tried first', () => {
  const [s1] = students(1);
  const rows = rowsFor([assign(s1, MON, 3)]); // weeks 3, 7, 11, 15
  const { appointments } = applyBlocks(rows, [{ coach: 'Coach A', week: 3 }], BLOCK_SLOTS);
  assertEqual(cellOf(findRow(appointments, 'S1', 1)), 'Coach A/Monday/09:00/wk1', 'week 1 before week 2');
});

test('(1) weeks whose (slot, week) is occupied are skipped', () => {
  const [s1, s2] = students(2);
  const rows = rowsFor([assign(s1, MON, 1), assign(s2, MON, 2)]); // week 2 is s2's
  const { appointments, exceptions } = applyBlocks(rows, [{ coach: 'Coach A', week: 1 }], BLOCK_SLOTS);
  assertEqual(exceptions.length, 0);
  assertEqual(cellOf(findRow(appointments, 'S1', 1)), 'Coach A/Monday/09:00/wk3');
  assertEqual(cellOf(findRow(appointments, 'S2', 1)), 'Coach A/Monday/09:00/wk2', 'the occupying meeting does not move');
  assertEqual(findRow(appointments, 'S2', 1).rescheduledFromWeek, '', 'an unmoved row carries no from-week');
});

test('(2) with the same slot full, any free (slot, week) of the coach is used — week order first', () => {
  // Tuesday 09:00 is taken in all three weeks of block 1; Monday 09:00 is free
  // in week 1 only (s4/s5 hold weeks 2 and 3).
  const [s1, s2, s3, s4, s5] = students(5);
  const rows = rowsFor([
    assign(s1, TUE, 1), assign(s2, TUE, 2), assign(s3, TUE, 3),
    assign(s4, MON, 2), assign(s5, MON, 3),
  ]);
  const blocks = [{ coach: 'Coach A', week: 1, day: 'Tuesday' }]; // a date block
  const { appointments, exceptions, movedCount } = applyBlocks(rows, blocks, BLOCK_SLOTS);
  assertEqual(exceptions.length, 0);
  assertEqual(movedCount, 1);
  const moved = findRow(appointments, 'S1', 1);
  assertEqual(cellOf(moved), 'Coach A/Monday/09:00/wk1', 'week 1 first, then the coach slot order');
  assertEqual(moved.rescheduledFromWeek, 1, 'the from-week is recorded even when the week is unchanged');
});

test('(2) the coach slot order (§4.6) picks the slot within the chosen week', () => {
  // Three slots at 09:00, 09:30, 10:00. All three offsets sit on 09:30, so

  // week 1 is blocked outright, so week 2 — and there the coach's slot order
  // puts 09:00 ahead of 10:00.
  const wide = buildSlots([avail('Coach A', 'Monday', '09:00', '11:00')], []);
  const [s1, s2, s3] = students(3);

  const { appointments, exceptions } = applyBlocks(rows, [{ coach: 'Coach A', week: 1 }], wide);
  assertEqual(exceptions.length, 0);

test('(3) with no free (slot, week) left in the block the meeting becomes an exception', () => {
  const [s1, s2, s3] = students(3);

group('§11.5 — invariants after redistribution');

// A whole week for Coach A and a single Tuesday date for Coach B, over a run
// with spare capacity (12 of the fixture's 30 places) so meetings really are
// rebooked rather than all falling through to exceptions.
const SLACK_QUOTAS = computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 0.5 }, 12, slotCountsOf(FIXTURE_SLOTS));
const SLACK_RUN = schedule(students(12), FIXTURE_SLOTS, 'auto', SLACK_QUOTAS);
const SLACK_APPOINTMENTS = expandToAppointments(SLACK_RUN.assignments, START_MONDAY, LONDON);

const BLOCKED_DATE = '2026-10-13'; // Tuesday of week 6
const RESOLVED_DATE = weekAndDayForDate(BLOCKED_DATE, START_MONDAY);
const RUN_BLOCKS = [
  { coach: 'Coach A', week: 1 },
  { coach: 'Coach B', week: RESOLVED_DATE.week, day: RESOLVED_DATE.day },
];
const BLOCKED_RUN = applyBlocks(SLACK_APPOINTMENTS, RUN_BLOCKS, FIXTURE_SLOTS, { timeZone: LONDON, startMonday: START_MONDAY });
const BLOCKED_ROWS = BLOCKED_RUN.appointments;
const ORIGINAL_BY_MEETING = new Map(SLACK_APPOINTMENTS.map((r) => [`${r.contactSfId}|${r.meetingNumber}`, r]));

test('the run really is disturbed (otherwise the assertions below prove nothing)', () => {
  assert(BLOCKED_RUN.movedCount > 0, `expected some meetings to move, moved ${BLOCKED_RUN.movedCount}`);
  assertEqual(RESOLVED_DATE.day, 'Tuesday');
});

test('no appointment lands on a blocked coach-week or coach-date', () => {
  BLOCKED_ROWS.forEach((r) => {
    RUN_BLOCKS.forEach((b) => {
      const hit = b.coach === r.coachName && b.week === r.weekNumber && (!b.day || b.day === r.day);
      assert(!hit, `${r.contactSfId} still sits on a blocked cell: ${cellOf(r)}`);
    });
  });
});

test('every moved appointment keeps its coach and stays inside its original block', () => {
  const moved = BLOCKED_ROWS.filter((r) => r.rescheduledFromWeek !== '');
  assert(moved.length > 0, 'at least one row moved');
  moved.forEach((r) => {
    const original = ORIGINAL_BY_MEETING.get(`${r.contactSfId}|${r.meetingNumber}`);
    assertEqual(r.coachName, original.coachName, `${r.contactSfId} changed coach`);
    assertEqual(r.rescheduledFromWeek, original.weekNumber, 'from-week is the week it left');
    assertEqual(blockOfWeek(r.weekNumber), blockOfWeek(original.weekNumber), `${r.contactSfId} left its block`);
    assertEqual(r.meetingNumber, blockOfWeek(r.weekNumber), 'meeting N stays in block N');
    assertEqual(r.serviceName, serviceNameFor(r.meetingNumber));
  });
});

test('unmoved appointments are untouched and carry a blank Rescheduled From Week', () => {
  BLOCKED_ROWS.filter((r) => r.rescheduledFromWeek === '').forEach((r) => {
    const original = ORIGINAL_BY_MEETING.get(`${r.contactSfId}|${r.meetingNumber}`);
    assertEqual(cellOf(r), cellOf(original), `${r.contactSfId} meeting ${r.meetingNumber} moved without saying so`);
  });
});

test('no coach is double-booked after redistribution', () => {
  const seen = new Set();
  BLOCKED_ROWS.forEach((r) => {

    assert(!seen.has(key), `double-booked: ${key}`);

});

test('no student is double-booked after redistribution', () => {

test('no appointment lands in week 4, 8 or 12 after redistribution', () => {

});

test('no appointment overlaps a class block after redistribution', () => {
  BLOCKED_ROWS.forEach((r) => {

test('every appointment still sits inside its coach availability', () => {

test('each student still has one meeting per block, minus any exception', () => {
  const byStudent = new Map();
  BLOCKED_ROWS.forEach((r) => {
    if (!byStudent.has(r.contactSfId)) byStudent.set(r.contactSfId, []);
    byStudent.get(r.contactSfId).push(blockOfWeek(r.weekNumber));
  });
  const exceptionCounts = new Map();
  BLOCKED_RUN.exceptions.forEach((e) => {
    exceptionCounts.set(e.student.contactSfId, (exceptionCounts.get(e.student.contactSfId) || 0) + 1);
  });
  byStudent.forEach((blocks, id) => {
    assertEqual(new Set(blocks).size, blocks.length, `student ${id} has two meetings in one block`);
    assertEqual(blocks.length, 4 - (exceptionCounts.get(id) || 0), `student ${id} meeting count`);
  });
});

test('rows stay sorted by date, then start time, then coach name (§7.1)', () => {
  for (let i = 1; i < BLOCKED_ROWS.length; i++) {
    const key = (r) => `${r.date}|${r.startTime}|${r.coachName}`;
    assert(key(BLOCKED_ROWS[i - 1]) <= key(BLOCKED_ROWS[i]), `row ${i} out of order`);
  }
});

test('a moved row start/end instants match its new day and time', () => {
  BLOCKED_ROWS.filter((r) => r.rescheduledFromWeek !== '').forEach((r) => {
    assertEqual(r.startDateTime.slice(0, 19), `${r.date}T${r.startTime}:00`, 'start instant follows the move');
    assertEqual(Date.parse(r.endDateTime) - Date.parse(r.startDateTime), 60 * 60 * 1000, 'still 60 minutes');
    assertEqual(r.dateValue.getDay(), (['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'].indexOf(r.day) + 1) % 7);
  });
});

test('a coach blocked for a whole block yields exactly one exception per affected student', () => {
  // Coach A is full (15 students across 5 slots), so every block-3 meeting of
  // theirs is displaced with nowhere to go.
  const blocks = [9, 10, 11].map((week) => ({ coach: 'Coach A', week }));
  const { appointments, exceptions } = applyBlocks(FULL_APPOINTMENTS, blocks, FIXTURE_SLOTS);

  const coachAStudents = new Set(FULL_APPOINTMENTS.filter((r) => r.coachName === 'Coach A').map((r) => r.contactSfId));
  assert(coachAStudents.size > 0, 'Coach A has students');
  assertEqual(exceptions.length, coachAStudents.size, 'exactly one exception per affected student');

  const perStudent = new Map();
  exceptions.forEach((e) => {
    assertEqual(e.block, 3);
    assertEqual(e.meetingNumber, 3);
    assertEqual(e.reason, 'no free slot in block 3 — coach blocked');
    assert(coachAStudents.has(e.student.contactSfId), 'only Coach A students are affected');
    perStudent.set(e.student.contactSfId, (perStudent.get(e.student.contactSfId) || 0) + 1);
  });
  perStudent.forEach((count, id) => assertEqual(count, 1, `student ${id} should have one exception`));

  coachAStudents.forEach((id) => {
    const kept = appointments.filter((r) => r.contactSfId === id);
    assertEqual(kept.length, 3, `student ${id} keeps their other three meetings`);
    assertDeep(kept.map((r) => blockOfWeek(r.weekNumber)).sort(), [1, 2, 4]);
  });

  const coachBRows = appointments.filter((r) => r.coachName === 'Coach B');
  assert(coachBRows.every((r) => r.rescheduledFromWeek === ''), 'Coach B is untouched');
});

group('§3.1 — class block validation');

// The parser's sheet-level entry points take an array-of-arrays (row 1 =
// headers), which is exactly what SheetJS hands them, so these exercise the
// real validation rules without needing a workbook.
const CLASS_HEADERS = ['Class Block', 'Day', 'Start Time', 'End Time', 'Class Name'];
const STUDENT_HEADERS = ['Contact SF ID', 'Student Name', 'Student Email', 'Class Block'];

/**
 * Four 3-hour weekday classes plus a 1.5-hour one = exactly 13.5 hours, the
 * expected total for a class block (SPEC.md §3.1).
 */
const expectedHourRows = (block, start = '09:00', end = '12:00') => {
  const toMinutes = (hhmm) => Number(hhmm.slice(0, 2)) * 60 + Number(hhmm.slice(3));
  const toTime = (m) => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const half = toTime(toMinutes(start) + (toMinutes(end) - toMinutes(start)) / 2); // Friday runs half-length
  return ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'].map((day, i) => [
    block,
    day,
    start,
    i === 4 ? half : end,
    'Class',
  ]);
};

const parseClasses = (rows) => parseClassScheduleSheet('classes.xlsx', [CLASS_HEADERS, ...rows]);
const parseStudents = (rows) => parseStudentListSheet('students.xlsx', [STUDENT_HEADERS, ...rows]);
const messages = (issues) => issues.map((issue) => issue.message).join('\n');

test('the expected class-block total is 13.5 hours', () => {
  assertEqual(CLASS_BLOCK_TOTAL_HOURS, 13.5);
  assertEqual(CLASS_BLOCK_TOTAL_MINUTES, 810);
});

test('a class block totalling exactly 13.5 hours is accepted without a warning', () => {
  const result = parseClasses(expectedHourRows('Block A'));
  assertDeep(result.errors, [], messages(result.errors));
  assertDeep(result.warnings, [], messages(result.warnings));
  assertEqual(result.rows.length, 5);
  const blocks = buildClassBlocks(result.rows);
  assertEqual(blocks.length, 1);
  assertEqual(blocks[0].minutes, CLASS_BLOCK_TOTAL_MINUTES);
  assertEqual(blocks[0].hours, 13.5);
});

test('several class blocks can coexist in one run, each with its own 13.5 hours', () => {
  const result = parseClasses([...expectedHourRows('Block A'), ...expectedHourRows('Block B', '13:00', '16:00')]);
  assertDeep(result.errors, [], messages(result.errors));
  assertDeep(result.warnings, [], messages(result.warnings));
  const blocks = buildClassBlocks(result.rows);
  assertDeep(blocks.map((b) => `${b.name}=${b.hours}`), ['Block A=13.5', 'Block B=13.5']);
});

test('a class block totalling less than 13.5 hours is a warning, naming the block and its total', () => {
  const rows = expectedHourRows('Block A').slice(0, 4); // 12 hours
  const result = parseClasses(rows);
  assertDeep(result.errors, [], 'a short block is flagged, not rejected');
  assertEqual(result.warnings.length, 1, messages(result.warnings));
  assert(result.warnings[0].message.includes('"Block A"'), 'the message names the block');
  assert(result.warnings[0].message.includes('12 hours'), `the message states the total: ${result.warnings[0].message}`);
  assert(result.warnings[0].message.includes('1.5 hours short of the expected 13.5 hours'), result.warnings[0].message);
});

test('a class block totalling more than 13.5 hours is warned about the same way', () => {

  const result = parseClasses(rows);

});

group('§4.4a — student-specific class clashes');

// Coach A is free Monday 09:00–12:00 → 09:00, 09:30, 10:00, 10:30, 11:00.
// Block A has a class 09:00–10:00 (rules out 09:00 and 09:30 for its students).

// 10:00 is the only window both cohorts can use, and no window is dead.
const MB_CLASSES = [
  { classBlock: 'Block A', day: 'Monday', start: t('09:00'), end: t('10:00'), className: 'A maths' },

const MB_BLOCKS = buildClassBlocks(MB_CLASSES);

const studentsIn = (n, block, prefix = 'S') =>
  students(n, prefix).map((student) => ({ ...student, classBlock: block }));

const startsFor = (block) => slotsForClassBlock(MB_SLOTS, block).map((s) => minutesToTime(s.start));

test('a class in one block no longer removes the slot for everybody', () => {

    'a coach loses no capacity because one cohort has a class then');
});

test('each slot records exactly which class blocks it clashes with', () => {
  const byStart = Object.fromEntries(MB_SLOTS.map((s) => [minutesToTime(s.start), s.blockedFor.join(',')]));
  assertDeep(byStart, {
    '09:00': 'block a', '09:30': 'block a', '10:00': '', '10:30': 'block b', '11:00': 'block b',
  });
  assert(slotAllowsClassBlock(MB_SLOTS[0], 'Block B'), '09:00 is fine for Block B');
  assert(!slotAllowsClassBlock(MB_SLOTS[0], 'Block A'), '09:00 clashes with Block A');
});

test('a window every class block blocks is dropped as unusable', () => {
  const slots = buildSlots(MB_AVAILABILITY, [
    ...MB_CLASSES,

    '09:30–10:30 are now blocked for both cohorts');
});

test('a student in block A can take a slot that overlaps block B classes', () => {

  const { assignments, unassigned } = schedule(studentsIn(1, 'Block A'), MB_SLOTS, 'auto', { 'Coach A': 5 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  assertEqual(unassigned.length, 0);

  assertEqual(many.unassigned.length, 0);

    ['10:00#1', '10:00#2', '10:00#3', '10:30#1', '10:30#2', '10:30#3', '11:00#1']);
});

test('appointments never overlap a class in the student own block, and may overlap another block', () => {
  const all = [...studentsIn(7, 'Block A', 'A'), ...studentsIn(6, 'Block B', 'B')];
  const { assignments } = schedule(all, MB_SLOTS, 'auto', { 'Coach A': 15 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  const rows = expandToAppointments(assignments, START_MONDAY, LONDON);
  assertEqual(rows.length, 52);
  rows.forEach((row) => {
    MB_CLASSES.forEach((cls) => {
      const clash = cls.day === row.day && cls.start < t(row.endTime) && t(row.startTime) < cls.end;
      if (classBlockKey(cls.classBlock) === classBlockKey(row.classBlock)) {
        assert(!clash, `${row.contactSfId} clashes with their own class at ${row.startTime}`);
      }
    });
    assertEqual(row.classBlock, row.contactSfId.startsWith('A') ? 'Block A' : 'Block B');

group('§7.3 — coach assignments batch upload');

// Two coaches with real Coach SF IDs, and enough capacity for everyone.
const BU_AVAILABILITY = [
  avail('Coach A', 'Monday', '09:00', '12:00', '005XX000001ABCAA0', 'a@example.com'),
  avail('Coach B', 'Tuesday', '09:00', '12:00', '0051Q00000XyZaBQAV', 'b@example.com'),

const BU_STUDENTS = students(5);

function batchUploadRun(studentList = BU_STUDENTS, slots = BU_SLOTS, availability = BU_AVAILABILITY) {
  const coaches = [...new Set(availability.map((row) => row.coachName))];
  const slotCounts = slotCountsOf(slots);
  const fte = Object.fromEntries(coaches.map((c) => [c, 1]));
  const quotas = computeQuotas(coaches, fte, studentList.length, slotCounts);
  return schedule(studentList, slots, 'auto', quotas, coaches);
}

// Two cohorts, three coaches, and every awkward case the views have to cope
// with: a coach with no students, a student whose class block is unknown, a
// student with no room left, and a meeting displaced by a blocked week.
const BK_CLASSES = [
  { classBlock: 'Block A', day: 'Monday', start: t('10:00'), end: t('11:00'), className: 'Maths' },
  { classBlock: 'Block A', day: 'Wednesday', start: t('09:00'), end: t('10:00'), className: 'Physics' },
  { classBlock: 'Block B', day: 'Tuesday', start: t('10:00'), end: t('11:00'), className: 'Chemistry, adv' },
];
const BK_BLOCKS = buildClassBlocks(BK_CLASSES);
const BK_AVAILABILITY = [
  avail('Coach A', 'Monday', '09:00', '12:00', 'C-A', 'a@example.com'),
  avail('Coach A', 'Wednesday', '09:00', '12:00', 'C-A', 'a@example.com'),
  avail("Coach B; O'Hara", 'Tuesday', '09:30', '12:30', 'C-B', 'b@example.com'),
  avail('Coach C', 'Thursday', '09:00', '11:00', 'C-C', 'c@example.com'),
];
const BK_SLOTS = buildSlots(BK_AVAILABILITY, BK_BLOCKS);
const BK_COACHES = ['Coach A', "Coach B; O'Hara", 'Coach C'];

// Names deliberately carry the characters iCalendar has to escape.
const BK_STUDENTS = [
  { contactSfId: 'S1', studentName: "Ann O'Neill, Jr.", studentEmail: 'ann@example.com', classBlock: 'Block A' },
  { contactSfId: 'S2', studentName: 'Bob; Smith\\Jones', studentEmail: 'bob@example.com', classBlock: 'Block B' },
  { contactSfId: 'S3', studentName: 'Cara Díaz', studentEmail: 'cara@example.com', classBlock: 'Block A' },
  { contactSfId: 'S4', studentName: 'Dan Blocked', studentEmail: 'dan@example.com', classBlock: 'Block Z' },
  { contactSfId: 'S5', studentName: 'Eve Nospace', studentEmail: 'eve@example.com', classBlock: 'Block A' },
];

// Quotas are set by hand rather than by FTE so the fixture can state exactly
// what it is testing: Coach C takes nobody, and there is no room for Eve.
const BK_QUOTAS = { 'Coach A': 2, "Coach B; O'Hara": 1, 'Coach C': 0 };

function bookingsRun() {
  const { assignments, unassigned } = schedule(BK_STUDENTS, BK_SLOTS, 'auto', BK_QUOTAS, BK_COACHES, {
    classBlocks: BK_BLOCKS,
  });
  const expanded = expandToAppointments(assignments, START_MONDAY, LONDON);
  // Coach A is away in week 1, so one of their meetings is rebooked (§11.3).
  const blocked = applyBlocks(expanded, [{ coach: 'Coach A', week: 1 }], BK_SLOTS, {
    timeZone: LONDON,
    startMonday: START_MONDAY,
  });
  return { assignments, unassigned, appointments: blocked.appointments, exceptions: blocked.exceptions };
}

group('§7.4 — ICS serialisation');

const BK_CAL_OPTIONS = { campusLabel: 'London', timeZone: LONDON, dtstamp: new Date(Date.UTC(2026, 7, 12, 9, 30, 0)) };
const COACH_A_MEETINGS = BK.appointments.filter((row) => row.coachName === 'Coach A');

/** One meeting on its own, for the assertions that are about a single event. */
const oneMeetingIcs = (meeting, options = BK_CAL_OPTIONS) => buildCalendarIcs([meeting], options);

test('text escaping covers backslashes, semicolons, commas and newlines', () => {
  assertEqual(escapeIcsText('a,b'), 'a\\,b', 'comma');
  assertEqual(escapeIcsText('a;b'), 'a\\;b', 'semicolon');
  assertEqual(escapeIcsText('a\\b'), 'a\\\\b', 'backslash, escaped once and only once');
  assertEqual(escapeIcsText('a\nb'), 'a\\nb', 'newline');
  assertEqual(escapeIcsText('a\r\nb'), 'a\\nb', 'CRLF is one escaped newline');
  assertEqual(escapeIcsText(null), '', 'nothing at all is an empty value');
});

test('special characters in student, coach and location values are escaped in the file', () => {
  const meeting = COACH_A_MEETINGS.find((row) => row.contactSfId === 'S2');
  const ics = oneMeetingIcs(meeting, { ...BK_CAL_OPTIONS, campusLabel: 'London, Bloomsbury; main' });
  assert(ics.includes('SUMMARY:Bob\\; Smith\\\\Jones'), `escaped summary, got:\n${ics}`);
  assert(ics.includes('LOCATION:London\\, Bloomsbury\\; main'), 'escaped location');
  assert(!/SUMMARY:[^\r\n]*[^\\];/.test(ics), 'no bare semicolon survives in SUMMARY');
});

test('every line ends CRLF and long lines are folded at 75 octets', () => {
  const ics = buildCalendarIcs(COACH_A_MEETINGS, BK_CAL_OPTIONS);
  assert(ics.endsWith('END:VCALENDAR\r\n'), 'the file ends with a CRLF-terminated END:VCALENDAR');
  assert(!/[^\r]\n/.test(ics), 'no bare LF anywhere');
  const encoder = new TextEncoder();
  ics.split('\r\n').filter(Boolean).forEach((line) => {
    assert(encoder.encode(line).length <= 75, `line within 75 octets: ${line}`);
  });
  const folded = foldIcsLine(`DESCRIPTION:${'é'.repeat(60)}`);
  assert(folded.includes('\r\n '), 'a long line is folded with a leading space');
  folded.split('\r\n').forEach((line) => assert(encoder.encode(line).length <= 75, 'each folded piece fits'));
  assertEqual(folded.split('\r\n').map((l, i) => (i ? l.slice(1) : l)).join(''), `DESCRIPTION:${'é'.repeat(60)}`, 'unfolding restores the value');
});

test('one VCALENDAR wraps one VEVENT per meeting, each with the required properties', () => {
  const ics = buildCalendarIcs(COACH_A_MEETINGS, BK_CAL_OPTIONS);
  assertEqual((ics.match(/BEGIN:VCALENDAR/g) || []).length, 1, 'exactly one calendar');
  assertEqual((ics.match(/END:VCALENDAR/g) || []).length, 1, 'closed exactly once');
  assertEqual((ics.match(/BEGIN:VEVENT/g) || []).length, COACH_A_MEETINGS.length, 'one BEGIN:VEVENT per meeting');
  assertEqual((ics.match(/END:VEVENT/g) || []).length, COACH_A_MEETINGS.length, 'each one closed');
  ['VERSION:2.0', 'PRODID:', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'].forEach((property) =>
    assertEqual((ics.match(new RegExp(property.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length, 1, `${property} is written once, for the file`)
  );
  // Every event carries its own copy of the per-meeting properties.
  ics.split('BEGIN:VEVENT').slice(1).forEach((event) => {
    ['UID:', 'DTSTAMP:', 'DTSTART:', 'DTEND:', 'SUMMARY:', 'DESCRIPTION:', 'LOCATION:', 'STATUS:CONFIRMED'].forEach(
      (property) => assert(event.includes(property), `${property} is present in every event`)
    );
  });
});

test('DTSTART and DTEND are the appointment\u2019s own instants, in UTC', () => {
  const meeting = COACH_A_MEETINGS[0];
  const ics = oneMeetingIcs(meeting);
  assert(ics.includes(`DTSTART:${icsUtcStamp(meeting.startDateTime)}`), 'DTSTART matches the schedule');
  assert(ics.includes(`DTEND:${icsUtcStamp(meeting.endDateTime)}`), 'DTEND matches the schedule');
  // September in London is BST, so 09:00 local is 08:00Z — the same instant
  // the appointments export writes as +01:00.
  assertEqual(icsUtcStamp('2026-09-14T09:00:00+01:00'), '20260914T080000Z', 'BST start');
  assertEqual(icsUtcStamp('2026-12-07T09:00:00+00:00'), '20261207T090000Z', 'GMT start, after the clocks change');
  assertEqual(icsUtcStamp('2026-09-14T09:00:00-04:00'), '20260914T130000Z', 'a Boston-style offset');
  assertEqual(new Date(Date.parse(meeting.endDateTime) - Date.parse(meeting.startDateTime)).getTime(), 3600000, 'still 60 minutes');
});

}

// ---- SPEC.md §17 — manual editing, and §18 its tests ----

group('§17 — editing fixture');

// Two cohorts whose classes sit on different days, so a slot one of them
// cannot use is still on offer to the other (§4.4a) — which is what makes the
// class-clash refusal worth testing rather than tautological.
const ED_CLASSES = [
  { classBlock: 'Block A', day: 'Monday', start: t('10:00'), end: t('11:00'), className: 'Maths' },
  { classBlock: 'Block B', day: 'Tuesday', start: t('10:00'), end: t('11:00'), className: 'Chemistry' },
];
const ED_BLOCKS = buildClassBlocks(ED_CLASSES);
const ED_AVAILABILITY = [
  avail('Coach A', 'Monday', '09:00', '12:00', 'C-A', 'a@example.com'),
  avail('Coach A', 'Wednesday', '09:00', '11:00', 'C-A', 'a@example.com'),
  avail('Coach B', 'Tuesday', '09:00', '12:00', 'C-B', 'b@example.com'),
  avail('Coach C', 'Thursday', '09:00', '10:00', 'C-C', 'c@example.com'),
];
const ED_SLOTS = buildSlots(ED_AVAILABILITY, ED_BLOCKS);
const ED_COACHES = ['Coach A', 'Coach B', 'Coach C'];
const ED_STUDENTS = [
  { contactSfId: 'E1', studentName: 'Ann Adams', studentEmail: 'ann@example.com', classBlock: 'Block A' },
  { contactSfId: 'E2', studentName: 'Ben Brook', studentEmail: 'ben@example.com', classBlock: 'Block A' },
  { contactSfId: 'E3', studentName: 'Cal Chase', studentEmail: 'cal@example.com', classBlock: 'Block A' },
  { contactSfId: 'E4', studentName: 'Dee Doyle', studentEmail: 'dee@example.com', classBlock: 'Block B' },
  { contactSfId: 'E5', studentName: 'Eli Evans', studentEmail: 'eli@example.com', classBlock: 'Block A' },
];
// Set by hand so the fixture states what it is testing: Coach C takes nobody,
// and Eli has no room at all.
const ED_QUOTAS = { 'Coach A': 2, 'Coach B': 2, 'Coach C': 0 };

function editRun(options = {}) {
  const { assignments, unassigned } = schedule(ED_STUDENTS, ED_SLOTS, 'auto', options.quotas || ED_QUOTAS, ED_COACHES, {
    classBlocks: ED_BLOCKS,
  });
  const expanded = expandToAppointments(assignments, START_MONDAY, LONDON);
  const blocked = applyBlocks(expanded, options.blocks || [], ED_SLOTS, {
    timeZone: LONDON,
    startMonday: START_MONDAY,
  });
  return { assignments, unassigned, appointments: blocked.appointments, exceptions: blocked.exceptions };
}

function editContext(options = {}) {
  return {
    slots: ED_SLOTS,
    classBlocks: ED_BLOCKS,
    blocks: options.blocks || [],
    quotas: options.quotas || ED_QUOTAS,
    mode: options.mode || 'auto',
    startMonday: START_MONDAY,
    timeZone: LONDON,
    students: ED_STUDENTS,
  };
}

const ED = editRun();
const ED_CTX = editContext();
const ED_PLACEMENTS = placementsFromAssignments(ED.assignments);

const edSlot = (coach, day, time) => ED_SLOTS.find((s) => s.coach === coach && s.day === day && s.start === t(time));
const edStudent = (id) => ED_STUDENTS.find((s) => s.contactSfId === id);
const apptsFor = (appointments, id) => appointments.filter((row) => row.contactSfId === id);
const placementOf = (placements, id) => placements.find((p) => p.student.contactSfId === id);
const positionLabel = (placements, id) => {
  const p = placementOf(placements, id);
  return p ? `${p.coach}/${p.slot.day}/${minutesToTime(p.slot.start)}/${p.offset}` : 'unassigned';
};
/** Every placement as one string, so a whole schedule can be compared at once. */
const shapeOf = (placements) =>
  placements.map((p) => `${p.student.contactSfId}:${p.coach}/${p.slot.day}/${minutesToTime(p.slot.start)}/${p.offset}`).join(' ');

/** Commits a move the way app.js does: validate, then keep the edit it returns. */
function move(context, placements, request) {
  const result = validateMove(context, placements, request);
  return result;
}

test('the fixture places four students and leaves one with nowhere to go', () => {
  assertEqual(ED.assignments.length, 4, 'four students were assigned');
  assertDeep(
    ED.unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`),
    [`E5:${REASONS.INSUFFICIENT_CAPACITY}`],
    'Eli is the only unassigned student, with the scheduler’s own reason'
  );
  assertEqual(ED.appointments.length, 16, 'four meetings each');
  assertEqual(ED.appointments.filter((r) => r.coachName === 'Coach C').length, 0, 'Coach C has nobody');
});

group('§18.1 — a move takes all four meetings with it');

test('a move rewrites all four meetings, and the new offset decides the weeks', () => {
  const from = placementOf(ED_PLACEMENTS, 'E1');
  const result = move(ED_CTX, ED_PLACEMENTS, { contactSfId: 'E1', coach: 'Coach B', day: 'Tuesday', start: t('11:00') });
  assert(result.ok, `the move was refused: ${result.refusal && result.refusal.message}`);
  assertEqual(result.offset, 1, 'the first free offset in the target cell');
  assertDeep(result.weeks, [1, 5, 9, 13], 'and the weeks that offset produces');

  const edited = buildEditedSchedule(ED, [result.edit], ED_CTX);
  const rows = apptsFor(edited.appointments, 'E1');
  assertEqual(rows.length, 4, 'still exactly four meetings');
  assert(rows.every((row) => row.coachName === 'Coach B'), 'every one is with the new coach');
  assert(rows.every((row) => row.day === 'Tuesday' && row.startTime === '11:00'), 'and on the new day and time');
  assertDeep(rows.map((r) => r.weekNumber).sort((a, b) => a - b), [1, 5, 9, 13], 'the new offset’s weeks');
  assertDeep(rows.map((r) => r.meetingNumber).sort(), [1, 2, 3, 4], 'meetings 1–4, one per term block');
  assert(rows.every((row) => row.coachSfId === 'C-B' && row.coachEmail === 'b@example.com'), 'the new coach’s details travel with them');
  assertEqual(from.coach, 'Coach A', 'and they really did start somewhere else');
  assertEqual(apptsFor(edited.appointments, 'E1').length + apptsFor(edited.appointments, 'E2').length, 8, 'nobody lost a meeting');
});

test('a move changes the offset, and with it the meeting weeks (§17.2)', () => {
  // Coach B, Tuesday 09:00 already holds offsets 1 and 2, so the mover takes 3.
  const result = move(ED_CTX, ED_PLACEMENTS, { contactSfId: 'E1', coach: 'Coach B', day: 'Tuesday', start: t('09:00') });
  assert(result.ok, `refused: ${result.refusal && result.refusal.message}`);
  assertEqual(result.offset, 3, 'the first free offset is 3');
  assertDeep(result.weeks, [3, 7, 11, 15], 'so their meetings move to weeks 3, 7, 11 and 15');
  const edited = buildEditedSchedule(ED, [result.edit], ED_CTX);
  assertDeep(apptsFor(edited.appointments, 'E1').map((r) => r.weekNumber).sort((a, b) => a - b), [3, 7, 11, 15]);
});

test('the grid offers the same offset the move takes (§17.2: shown before committing)', () => {

});

test('the grid marks cells outside availability and names the blocks a cell clashes with', () => {

  assertDeep(grid.days, ['Monday', 'Wednesday'], 'only the days this coach works');

group('§18.2 — every hard refusal, separately');

test('refused: the target slot overlaps a class in the student’s own block (§17.4)', () => {
  const result = move(ED_CTX, ED_PLACEMENTS, { contactSfId: 'E1', coach: 'Coach A', day: 'Monday', start: t('10:00') });
  assertEqual(result.ok, false, 'the move is blocked');

});

test('refused: any of the four meetings falls on the coach’s blocked week (§17.4)', () => {
  // Offset 1 at Coach B, Tuesday 11:00 means weeks 1, 5, 9 and 13 — so
  // blocking any one of them must refuse the move, and one of the others
  // must not.
  [1, 5, 9, 13].forEach((week) => {
    const blocks = [{ coach: 'Coach B', week }];
    const result = move(editContext({ blocks }), placementsFromAssignments(editRun({ blocks }).assignments), {
      contactSfId: 'E1',
      coach: 'Coach B',
      day: 'Tuesday',
      start: t('11:00'),
    });
    assertEqual(result.ok, false, `week ${week} is blocked, so the move must be refused`);
    assertEqual(result.refusal.code, EDIT_REFUSALS.BLOCKED_WEEK, `week ${week}`);
    assert(result.refusal.message.includes(String(week)), `the message names week ${week}: ${result.refusal.message}`);
    assert(
      result.refusal.message.includes('not rebooked automatically'),
      'and says no §11.3 rebooking was attempted'
    );
  });

  const spare = [{ coach: 'Coach B', week: 2 }];
  const allowed = move(editContext({ blocks: spare }), placementsFromAssignments(editRun({ blocks: spare }).assignments), {
    contactSfId: 'E1',
    coach: 'Coach B',
    day: 'Tuesday',
    start: t('11:00'),
  });
  assert(allowed.ok, 'week 2 holds none of offset 1’s meetings, so that move is fine');
});

group('§18.3 — a swap is refused whole or not at all');

test('a swap that fails in one direction is refused whole, and neither student moves', () => {

    student: { contactSfId: 'E8', studentName: 'No Block', classBlock: '' },
    coach: 'Coach C',
    day: 'Thursday',
    start: t('09:00'),
  });
  assertEqual(blank.refusal.code, EDIT_REFUSALS.NO_CLASS_BLOCK, 'a blank class block is refused the same way');
});

group('§18.6 — undo, reset, and replay');

test('undo removes one edit and leaves the rest applied', () => {
  const first = move(ED_CTX, ED_PLACEMENTS, { contactSfId: 'E1', coach: 'Coach B', day: 'Tuesday', start: t('11:00') });
  const afterFirst = buildEditedSchedule(ED, [first.edit], ED_CTX);
  const second = move(ED_CTX, afterFirst.placements, { contactSfId: 'E2', coach: 'Coach A', day: 'Monday', start: t('11:00') });
  const both = buildEditedSchedule(ED, [first.edit, second.edit], ED_CTX);

  assertEqual(both.edits.length, 2, 'both edits applied');
  assertEqual(
    shapeOf(buildEditedSchedule(ED, [first.edit], ED_CTX).placements),
    shapeOf(afterFirst.placements),
    'undoing the second leaves exactly the schedule the first produced'
  );
  assertEqual(positionLabel(both.placements, 'E2'), 'Coach A/Monday/11:00/1', 'and the second really had moved someone');
});

test('reset restores the generated schedule exactly (§17.7)', () => {
  const first = move(ED_CTX, ED_PLACEMENTS, { contactSfId: 'E1', coach: 'Coach B', day: 'Tuesday', start: t('11:00') });
  const edited = buildEditedSchedule(ED, [first.edit], ED_CTX);
  assert(shapeOf(edited.placements) !== shapeOf(ED_PLACEMENTS), 'the edit changed something');

  const reset = buildEditedSchedule(ED, [], ED_CTX);
  assertEqual(shapeOf(reset.placements), shapeOf(ED_PLACEMENTS), 'and resetting puts it all back');
  assertDeep(
    reset.appointments.map((r) => `${r.contactSfId}|${r.date}|${r.startTime}|${r.coachName}`),
    ED.appointments.map((r) => `${r.contactSfId}|${r.date}|${r.startTime}|${r.coachName}`),
    'row for row, the generated schedule'
  );
  assertEqual(reset.unassigned.length, ED.unassigned.length, 'including who was unassigned');

test('replay drops an edit that no longer fits, rather than applying it blind', () => {
  const first = move(ED_CTX, ED_PLACEMENTS, { contactSfId: 'E1', coach: 'Coach B', day: 'Tuesday', start: t('11:00') });
  const afterFirst = buildEditedSchedule(ED, [first.edit], ED_CTX);
  // Ben is sent to the position Ann is now in. Undoing Ann's move (replaying
  // Ben's edit alone) leaves Ben's target occupied by Ann again.
  const second = validateMove(ED_CTX, afterFirst.placements, {
    contactSfId: 'E2',
    coach: 'Coach B',
    day: 'Tuesday',
    start: t('11:00'),
    offset: 2,
  });
  assert(second.ok, `refused: ${second.refusal && second.refusal.message}`);

  const both = replayEdits(ED_CTX, ED_PLACEMENTS, [first.edit, second.edit]);
  assertEqual(both.applied.length, 2, 'both apply in order');

  const undone = replayEdits(ED_CTX, ED_PLACEMENTS, [second.edit]);
  assertEqual(undone.applied.length, 1, 'Ben’s edit still fits on its own');
  assertEqual(positionLabel(undone.placements, 'E2'), 'Coach B/Tuesday/11:00/2');

  // And an edit whose slot has gone is skipped, not guessed at.
  const strippedContext = { ...ED_CTX, slots: ED_SLOTS.filter((s) => !(s.coach === 'Coach B' && s.start === t('11:00'))) };
  const stripped = replayEdits(strippedContext, ED_PLACEMENTS, [first.edit]);
  assertEqual(stripped.applied.length, 0, 'nothing was applied');
  assertEqual(stripped.skipped.length, 1, 'and the edit is reported as skipped');
});

group('§18.7 — regeneration discards edits');

test('an edit made against one schedule is not carried into a rebuilt one (§17.5a)', () => {
  const first = move(ED_CTX, ED_PLACEMENTS, { contactSfId: 'E1', coach: 'Coach B', day: 'Tuesday', start: t('11:00') });
  assert(first.ok);

group('§18.8 — invariants over an edited schedule');

test('every §9 and §11.5 invariant still holds after several edits', () => {
  const blocks = [{ coach: 'Coach A', week: 5 }];
  const base = editRun({ blocks });
  const context = editContext({ blocks });
  const p0 = placementsFromAssignments(base.assignments);

  const one = move(context, p0, { contactSfId: 'E1', coach: 'Coach B', day: 'Tuesday', start: t('11:00') });
  assert(one.ok, `refused: ${one.refusal && one.refusal.message}`);
  const afterOne = buildEditedSchedule(base, [one.edit], context);
  const two = move(context, afterOne.placements, { contactSfId: 'E5', student: edStudent('E5'), coach: 'Coach C', day: 'Thursday', start: t('09:00') });
  assert(two.ok, `refused: ${two.refusal && two.refusal.message}`);
  const afterTwo = buildEditedSchedule(base, [one.edit, two.edit], context);
  const three = validateSwap(context, afterTwo.placements, { contactSfId: 'E3', withContactSfId: 'E4' });
  assert(three.ok, `refused: ${three.refusal && three.refusal.message}`);

  const edited = buildEditedSchedule(base, [one.edit, two.edit, three.edit], context);
  const rows = edited.appointments;

  assertEqual(rows.filter((r) => [4, 8, 12].includes(r.weekNumber)).length, 0, 'nothing in weeks 4, 8 or 12');

  const counts = new Map();
  rows.forEach((r) => counts.set(r.contactSfId, (counts.get(r.contactSfId) || 0) + 1));
  assertEqual(counts.size, edited.assignments.length, 'every assigned student has rows');
  counts.forEach((count, id) => assertEqual(count, 4, `student ${id} has four meetings`));

  const coachSeen = new Set();
  const studentSeen = new Set();
  rows.forEach((r) => {
    const coachKey = `${r.coachName}|${r.date}|${r.startTime}`;
    assert(!coachSeen.has(coachKey), `coach double-booked: ${coachKey}`);
    coachSeen.add(coachKey);
    const studentKey = `${r.contactSfId}|${r.date}|${r.startTime}`;
    assert(!studentSeen.has(studentKey), `student double-booked: ${studentKey}`);
    studentSeen.add(studentKey);
  });

  rows.forEach((r) => {
    ED_CLASSES.forEach((cls) => {
      const ownBlock = classBlockKey(cls.classBlock) === classBlockKey(r.classBlock);
      const clash = ownBlock && cls.day === r.day && cls.start < t(r.endTime) && t(r.startTime) < cls.end;
      assert(!clash, `${r.studentName} is scheduled during their own ${cls.className}`);
    });
    const inside = ED_AVAILABILITY.some(
      (b) => b.coachName === r.coachName && b.day === r.day && b.start <= t(r.startTime) && t(r.endTime) <= b.end
    );
    assert(inside, `${r.coachName} ${r.day} ${r.startTime} is outside their availability`);
  });

  // §11.5 — nothing sits on a blocked coach-week or coach-date.
  const isBlocked = blockedWeekLookup(blocks);
  rows.forEach((r) => {
    assert(!isBlocked(r.coachName, r.weekNumber, r.day), `${r.coachName} is blocked in week ${r.weekNumber}`);
  });

  // §4.3 — a student keeps one coach, one weekday and one start time.
  counts.forEach((_, id) => {
    const own = apptsFor(rows, id);
    assertEqual(new Set(own.map((r) => `${r.coachName}|${r.day}|${r.startTime}`)).size, 1, `${id} has one slot`);
    assertDeep(own.map((r) => r.meetingNumber).sort(), [1, 2, 3, 4], `${id} has meetings 1–4`);
  });

  // §7.1 — and the rows are still in export order.
  assertDeep(
    rows.map((r) => `${r.date}|${r.startTime}|${r.coachName}`),
    sortAppointments([...rows]).map((r) => `${r.date}|${r.startTime}|${r.coachName}`),
    'the edited schedule is in §7.1 row order'
  );
});

test('an unedited student keeps their rows, including a §11.3 rescheduled one', () => {
  const blocks = [{ coach: 'Coach A', week: 1 }];
  const base = editRun({ blocks });
  const context = editContext({ blocks });
  const moved = base.appointments.filter((r) => r.rescheduledFromWeek !== '');

  const untouchedId = moved[0].contactSfId;

  assertDeep(

});

test('moving a student with a §11.3 exception gives them their fourth meeting back', () => {
  // Coach A is away for the whole of block 2, so their students lose a meeting
  // they cannot get back with that coach (§11.3(3)).
  const blocks = [5, 6, 7].map((week) => ({ coach: 'Coach A', week }));
  const base = editRun({ blocks });

  assert(base.exceptions.length > 0, 'the fixture produces an exception');
  const stranded = base.exceptions[0].student.contactSfId;
  assertEqual(apptsFor(base.appointments, stranded).length, 3, 'that student is down to three meetings');

group('HTML escaping');

// app.js builds most of its markup as strings and assigns it with innerHTML,
// and the values interpolated into it — coach names, student names, contact
// IDs — all come from an uploaded spreadsheet. escapeHtml is the only thing
// standing between a hostile cell and script execution, so its contract is
// asserted in both positions it is used in: element content and, crucially,
// inside a quoted attribute value.

test('escapeHtml neutralises the characters that end a text node', () => {
  // The closing tag is written with an escaped slash so this literal cannot
  // end the inline <script> this suite lives in.
  assertEqual(escapeHtml('<script>alert(1)<\/script>'), '&lt;script&gt;alert(1)&lt;\/script&gt;', 'tags cannot open');
  assertEqual(escapeHtml('Fish & Chips'), 'Fish &amp; Chips', 'ampersands are escaped once');
  assertEqual(escapeHtml('a &amp; b'), 'a &amp;amp; b', 'and an already-escaped entity is not double-decoded');
});

test('escapeHtml neutralises the quotes that end an attribute value', () => {
  assertEqual(escapeHtml('Ada"'), 'Ada&quot;', 'double quote');
  assertEqual(escapeHtml("O'Hara"), 'O&#39;Hara', 'single quote');
});

test('a hostile coach name cannot add an attribute to the markup it lands in', () => {
  // The exact shape of the §5.1 FTE input, the §11.2 coach picker and the §14
  // bookings selectors: a spreadsheet value inside a quoted attribute.
  const hostile = 'Ada" onfocus="window.__xssProbe = 1" autofocus x="';
  const host = document.createElement('div');
  host.innerHTML = `<input type="number" class="fte" data-coach="${escapeHtml(hostile)}" value="1.00" />`;
  const input = host.querySelector('input');

  assertEqual(
    [...input.attributes].map((a) => a.name).sort().join(','),
    'class,data-coach,type,value',
    'no extra attributes were smuggled in'
  );
  assertEqual(input.dataset.coach, hostile, 'and the name still reads back exactly as it was uploaded');

  const option = document.createElement('div');
  option.innerHTML = `<select><option value="${escapeHtml(hostile)}">${escapeHtml(hostile)}</option></select>`;
  assertEqual(option.querySelector('option').value, hostile, 'the same holds for an <option> value');
  assertEqual(option.querySelectorAll('option').length, 1, 'and no second element was created');
});

test('escapeHtml prints nothing for a missing value', () => {
  assertEqual(escapeHtml(undefined), '', 'an absent optional field leaves a blank cell');
  assertEqual(escapeHtml(null), '', 'as does an empty one');
  assertEqual(escapeHtml(0), '0', 'but a falsy value that is real is kept');
});

// ---- render ----

const list = document.getElementById('results');
const summary = document.getElementById('summary');
let lastGroup = null;
let passed = 0;
let skipped = 0;

results.forEach((result) => {
  if (result.group !== lastGroup) {
    lastGroup = result.group;
    const heading = document.createElement('li');
    heading.className = 'test-group';
    heading.textContent = result.group;
    list.appendChild(heading);
  }
  if (result.skipped) skipped += 1;
  else if (result.ok) passed += 1;
  const item = document.createElement('li');
  item.className = result.skipped ? 'skip' : result.ok ? 'pass' : 'fail';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = result.skipped ? 'SKIP' : result.ok ? 'PASS' : 'FAIL';
  item.appendChild(badge);
  item.appendChild(document.createTextNode(result.name));
  if (!result.ok || result.skipped) {
    const detail = document.createElement('span');
    detail.className = 'detail';
    detail.textContent = result.detail;
    item.appendChild(detail);
  }
  list.appendChild(item);
});

const failed = results.length - passed - skipped;
const skipNote = skipped > 0 ? ` ${skipped} skipped (SheetJS not loaded).` : '';
summary.className = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;
summary.textContent = failed === 0
  ? `All ${passed} tests passed.${skipNote}`
  : `${failed} of ${results.length} tests failed.${skipNote}`;
document.title = `${failed === 0 ? 'PASS' : 'FAIL'} — Scheduler tests`;
</script>
