<body>
<main class="container">
  <h1>Scheduler engine tests</h1>
  <p>Assertions for <code>js/scheduler.js</code> against SPEC.md §4, §5 and §9. No DOM is touched by the engine itself.</p>
  <div id="summary" class="test-summary">Running…</div>

<script type="module">
import {
  buildSlots,
  buildClassBlocks,
  classBlockKey,
  slotAllowsClassBlock,
  slotsForClassBlock,
  computeQuotas,
  schedule,
  expandToAppointments,
  applyBlocks,
  weekAndDayForDate,
  blockOfWeek,
  weeksInBlock,
  blockedExceptionReason,
  weeksForOffset,
  minutesToTime,
  serviceNameFor,
  BLOCK_WEEKS,
  MEETING_STATUS,
  CLASS_BLOCK_TOTAL_MINUTES,
  REASONS,
} from './js/scheduler.js';
import { formatIsoWithOffset, wallClockToInstant, campusOrDefault, CAMPUSES } from './js/timezone.js';
import { parseClassScheduleSheet, parseStudentListSheet, checkStudentClassBlocks } from './js/parse.js';

// ---- tiny assertion harness ----

const results = [];
let currentGroup = '';

function group(name) { currentGroup = name; }

function test(name, fn) {
  try {
    fn();
    results.push({ group: currentGroup, name, ok: true, detail: '' });
  } catch (e) {
    results.push({ group: currentGroup, name, ok: false, detail: e && e.message ? e.message : String(e) });
  }
}

function fail(message) { throw new Error(message); }

function assert(condition, message) {
  if (!condition) fail(message || 'assertion failed');
}

function assertEqual(actual, expected, message) {
  if (actual !== expected) fail(`${message || 'values differ'}\n  expected: ${expected}\n  actual:   ${actual}`);
}

function assertDeep(actual, expected, message) {
  const a = JSON.stringify(actual);
  const b = JSON.stringify(expected);
  if (a !== b) fail(`${message || 'values differ'}\n  expected: ${b}\n  actual:   ${a}`);
}

// ---- helpers ----

const t = (hhmm) => {
  const [h, m] = hhmm.split(':').map(Number);
  return h * 60 + m;
};

const avail = (coachName, day, start, end, coachSfId = '', coachEmail = '') => ({
  coachName, coachSfId, coachEmail, day, start: t(start), end: t(end),
});
const cls = (day, start, end, className = 'Class') => ({ day, start: t(start), end: t(end), className });
const students = (n, prefix = 'S') =>
  Array.from({ length: n }, (_, i) => ({
    contactSfId: `${prefix}${i + 1}`,
    studentName: `${prefix}tudent ${i + 1}`,
    studentEmail: `${prefix.toLowerCase()}${i + 1}@example.com`,
  }));

const LONDON = 'Europe/London';
const isoAt = (y, m, d, hhmm, tz) => formatIsoWithOffset(wallClockToInstant(y, m, d, t(hhmm), tz), tz);

const slotLabel = (s) => `${s.coach}/${s.day}/${minutesToTime(s.start)}`;

// Shared fixture used by the mode and invariant tests.
// Coach A: Mon 09:00–12:00 (Mon class 10:00–11:00 removes 3 windows → 09:00, 11:00)
//          Wed 09:00–12:00 (Wed class 09:00–10:00 removes 2 windows → 10:00, 10:30, 11:00)
// Coach B: Tue 09:30–12:30, no classes → 09:30, 10:00, 10:30, 11:00, 11:30
const FIXTURE_CLASSES = [cls('Monday', '10:00', '11:00', 'Maths'), cls('Wednesday', '09:00', '10:00', 'Physics')];
const FIXTURE_AVAILABILITY = [
  avail('Coach A', 'Monday', '09:00', '12:00', 'C-A', 'a@example.com'),
  avail('Coach A', 'Wednesday', '09:00', '12:00', 'C-A', 'a@example.com'),
  avail('Coach B', 'Tuesday', '09:30', '12:30'),
];
const FIXTURE_SLOTS = buildSlots(FIXTURE_AVAILABILITY, FIXTURE_CLASSES);
const START_MONDAY = '2026-09-07'; // a Monday

function slotCountsOf(slots) {
  const counts = {};
  slots.forEach((s) => { counts[s.coach] = (counts[s.coach] || 0) + 1; });
  return counts;
}

// ---- §4.4 valid slot definition ----

group('§4.4 — valid slots');

test('60-minute windows tile an availability block on 30-minute boundaries', () => {
  const slots = buildSlots([avail('C', 'Monday', '09:00', '12:00')], []);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:00', '09:30', '10:00', '10:30', '11:00']);
  assert(slots.every((s) => s.end - s.start === 60), 'every slot is 60 minutes long');
});

test('slots must start on :00 or :30 and fit entirely inside the block', () => {
  const slots = buildSlots([avail('C', 'Monday', '09:15', '10:30')], []);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:30'], 'only 09:30 fits inside 09:15–10:30');
});

test('a block shorter than 60 minutes yields no slots', () => {
  assertEqual(buildSlots([avail('C', 'Monday', '09:00', '09:45')], []).length, 0);
});

test('windows overlapping a class block are excluded; touching ones are kept', () => {
  const slots = buildSlots([avail('C', 'Monday', '09:00', '12:00')], [cls('Monday', '10:00', '11:00')]);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:00', '11:00'],
    '09:30/10:00/10:30 overlap the class; 09:00–10:00 and 11:00–12:00 only touch it');
});

test('a class block on another day does not remove slots', () => {
  const slots = buildSlots([avail('C', 'Monday', '09:00', '11:00')], [cls('Tuesday', '09:00', '17:00')]);
  assertEqual(slots.length, 3);
});

test('slots are ordered by day (Mon→Sun) then start time', () => {
  const slots = buildSlots([
    avail('C', 'Wednesday', '09:00', '10:00'),
    avail('C', 'Monday', '11:00', '12:00'),
    avail('C', 'Monday', '09:00', '10:00'),
  ], []);
  assertDeep(slots.map(slotLabel), ['C/Monday/09:00', 'C/Monday/11:00', 'C/Wednesday/09:00']);
});

test('overlapping availability rows do not produce duplicate slots', () => {
  const slots = buildSlots([
    avail('C', 'Monday', '09:00', '11:00'),
    avail('C', 'Monday', '10:00', '12:00'),
  ], []);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:00', '09:30', '10:00', '10:30', '11:00']);
});

test('Coach ID from the availability file is carried onto slots', () => {
  assertEqual(FIXTURE_SLOTS.find((s) => s.coach === 'Coach A').coachSfId, 'C-A');
  assertEqual(FIXTURE_SLOTS.find((s) => s.coach === 'Coach B').coachSfId, '');
});

test('fixture builds the expected slots for both coaches', () => {
  assertDeep(FIXTURE_SLOTS.map(slotLabel), [
    'Coach A/Monday/09:00',
    'Coach A/Monday/11:00',
    'Coach B/Tuesday/09:30',
    'Coach B/Tuesday/10:00',
    'Coach B/Tuesday/10:30',
    'Coach B/Tuesday/11:00',
    'Coach B/Tuesday/11:30',
    'Coach A/Wednesday/10:00',
    'Coach A/Wednesday/10:30',
    'Coach A/Wednesday/11:00',
  ]);
});

// ---- §5.1 quota maths ----

group('§5.1 — FTE quotas');

test('equal FTE splits students evenly', () => {
  const quotas = computeQuotas(['A', 'B'], { A: 1, B: 1 }, 10, { A: 10, B: 10 });
  assertDeep(quotas, { A: 5, B: 5 });
});

test('part-time 0.5 FTE coach gets half the full-time share', () => {
  const quotas = computeQuotas(['A', 'B'], { A: 1, B: 0.5 }, 9, { A: 10, B: 10 });
  assertDeep(quotas, { A: 6, B: 3 }, '9 × (1/1.5) = 6 and 9 × (0.5/1.5) = 3');
});

test('largest remainder awards the leftover student to the larger fraction', () => {
  // 10 × (1/1.5) = 6.67 → 6 r.67; 10 × (0.5/1.5) = 3.33 → 3 r.33; leftover → A.
  assertDeep(computeQuotas(['A', 'B'], { A: 1, B: 0.5 }, 10, { A: 10, B: 10 }), { A: 7, B: 3 });
});

test('quotas always sum to the student count when capacity allows', () => {
  const quotas = computeQuotas(['A', 'B', 'C'], { A: 1, B: 0.5, C: 0.25 }, 17, { A: 10, B: 10, C: 10 });
  assertEqual(Object.values(quotas).reduce((a, b) => a + b, 0), 17);
});

test('quota is capped at capacity (valid slots × 3) and the rest redistributed', () => {
  // A is full-time but has only 1 slot → capacity 3. B (0.5 FTE) absorbs the rest.
  const quotas = computeQuotas(['A', 'B'], { A: 1, B: 0.5 }, 12, { A: 1, B: 10 });
  assertDeep(quotas, { A: 3, B: 9 });
});

test('redistribution respects FTE proportions among coaches with spare capacity', () => {
  // A capped at 3; the remaining 9 students split 1 : 0.5 between B and C → 6 : 3.
  const quotas = computeQuotas(['A', 'B', 'C'], { A: 1, B: 1, C: 0.5 }, 12, { A: 1, B: 10, C: 10 });
  assertDeep(quotas, { A: 3, B: 6, C: 3 });
});

test('total quota never exceeds total capacity', () => {
  const quotas = computeQuotas(['A', 'B'], { A: 1, B: 1 }, 40, { A: 2, B: 3 });
  assertDeep(quotas, { A: 6, B: 9 }, 'capacity is 6 + 9 = 15, well below 40 students');
});

test('a coach with no valid slots receives a zero quota', () => {
  assertDeep(computeQuotas(['A', 'B'], { A: 1, B: 1 }, 6, { A: 0, B: 10 }), { A: 0, B: 6 });
});

test('zero students produces zero quotas', () => {
  assertDeep(computeQuotas(['A', 'B'], { A: 1, B: 1 }, 0, { A: 5, B: 5 }), { A: 0, B: 0 });
});

// ---- §5.1 auto mode ----

group('§5.1 — auto-assign mode');

test('students fill each coach up to quota, slot by slot, offset 1→2→3', () => {
  const slots = buildSlots([avail('A', 'Monday', '09:00', '11:00')], []); // 09:00, 09:30, 10:00
  const { assignments, unassigned } = schedule(students(5), slots, 'auto', { A: 5 });
  assertEqual(unassigned.length, 0);
  assertDeep(
    assignments.map((a) => `${a.student.contactSfId}→${slotLabel(a.slot)}#${a.offset}`),
    ['S1→A/Monday/09:00#1', 'S2→A/Monday/09:00#2', 'S3→A/Monday/09:00#3',
     'S4→A/Monday/09:30#1', 'S5→A/Monday/09:30#2']
  );
});

test('a slot never holds more than 3 students (one per offset)', () => {
  const { assignments } = schedule(students(30), FIXTURE_SLOTS, 'auto',
    computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 1 }, 30, slotCountsOf(FIXTURE_SLOTS)));
  const perSlot = new Map();
  assignments.forEach((a) => {
    const key = slotLabel(a.slot);
    if (!perSlot.has(key)) perSlot.set(key, new Set());
    const offsets = perSlot.get(key);
    assert(!offsets.has(a.offset), `offset ${a.offset} used twice in ${key}`);
    offsets.add(a.offset);
  });
  perSlot.forEach((offsets, key) => assert(offsets.size <= 3, `${key} holds ${offsets.size} students`));
});

test('coaches are filled in coach file order', () => {
  const quotas = computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 0.5 }, 8, slotCountsOf(FIXTURE_SLOTS));
  assertDeep(quotas, { 'Coach A': 5, 'Coach B': 3 });
  const { assignments } = schedule(students(8), FIXTURE_SLOTS, 'auto', quotas);
  assertDeep(assignments.map((a) => a.coach),
    ['Coach A', 'Coach A', 'Coach A', 'Coach A', 'Coach A', 'Coach B', 'Coach B', 'Coach B']);
});

test('surplus students beyond total capacity are unassigned with "insufficient capacity"', () => {
  const slotCounts = slotCountsOf(FIXTURE_SLOTS); // 5 + 5 slots → capacity 30
  const quotas = computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 1 }, 34, slotCounts);
  const { assignments, unassigned } = schedule(students(34), FIXTURE_SLOTS, 'auto', quotas);
  assertEqual(assignments.length, 30, 'capacity is 10 slots × 3');
  assertEqual(unassigned.length, 4);
  assert(unassigned.every((u) => u.reason === REASONS.INSUFFICIENT_CAPACITY), 'reason string is "insufficient capacity"');
  assertEqual(REASONS.INSUFFICIENT_CAPACITY, 'insufficient capacity');
  assertDeep(unassigned.map((u) => u.student.contactSfId), ['S31', 'S32', 'S33', 'S34']);
});

test('identical inputs produce identical output (§4.6 determinism)', () => {
  const args = [students(8), FIXTURE_SLOTS, 'auto',
    computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 0.5 }, 8, slotCountsOf(FIXTURE_SLOTS))];
  const first = schedule(...args);
  const second = schedule(...args);
  const shape = (r) => ({
    assignments: r.assignments.map((a) => `${a.student.contactSfId}|${slotLabel(a.slot)}|${a.offset}`),
    unassigned: r.unassigned.map((u) => `${u.student.contactSfId}|${u.reason}`),
  });
  assertDeep(shape(first), shape(second));
});

// ---- §5.2 pre-allocated mode ----

group('§5.2 — pre-allocated mode');

const PAIRED_STUDENTS = students(4);

test('paired students are assigned to their own coach, offset 1→2→3 per slot', () => {
  const pairings = [
    { contactSfId: 'S1', coachName: 'Coach B' },
    { contactSfId: 'S2', coachName: 'Coach A' },
    { contactSfId: 'S3', coachName: 'Coach B' },
    { contactSfId: 'S4', coachName: 'Coach A' },
  ];
  const { assignments, unassigned } = schedule(PAIRED_STUDENTS, FIXTURE_SLOTS, 'pre-allocated', pairings);
  assertEqual(unassigned.length, 0);
  const byStudent = Object.fromEntries(assignments.map((a) => [a.student.contactSfId, `${slotLabel(a.slot)}#${a.offset}`]));
  assertDeep(byStudent, {
    S1: 'Coach B/Tuesday/09:30#1',
    S3: 'Coach B/Tuesday/09:30#2',
    S2: 'Coach A/Monday/09:00#1',
    S4: 'Coach A/Monday/09:00#2',
  }, 'each coach fills their own first slot, in pairings-file order');
});

test('students missing from the pairings file are unassigned with "no pairing"', () => {
  const pairings = [{ contactSfId: 'S1', coachName: 'Coach A' }];
  const { unassigned } = schedule(students(3), FIXTURE_SLOTS, 'pre-allocated', pairings);
  assertDeep(unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`), ['S2:no pairing', 'S3:no pairing']);
  assertEqual(REASONS.NO_PAIRING, 'no pairing');
});

test('pairings naming an unknown coach are unassigned with "coach not found"', () => {
  const pairings = [
    { contactSfId: 'S1', coachName: 'Coach Z' },
    { contactSfId: 'S2', coachName: 'Coach A' },
  ];
  const { assignments, unassigned } = schedule(students(2), FIXTURE_SLOTS, 'pre-allocated', pairings);
  assertDeep(unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`), ['S1:coach not found']);
  assertEqual(assignments.length, 1);
  assertEqual(REASONS.COACH_NOT_FOUND, 'coach not found');
});

test('a coach with availability but no valid slots is found, not "coach not found"', () => {
  const pairings = [{ contactSfId: 'S1', coachName: 'Coach C' }];
  const { unassigned } = schedule(students(1), FIXTURE_SLOTS, 'pre-allocated', pairings, ['Coach A', 'Coach B', 'Coach C']);
  assertDeep(unassigned.map((u) => u.reason), [REASONS.COACH_OVER_CAPACITY]);
});

test('students beyond a coach capacity are unassigned with "coach over capacity"', () => {
  const slots = buildSlots([avail('A', 'Monday', '09:00', '10:00')], []); // 1 slot → capacity 3
  const all = students(5);
  const pairings = all.map((s) => ({ contactSfId: s.contactSfId, coachName: 'A' }));
  const { assignments, unassigned } = schedule(all, slots, 'pre-allocated', pairings);
  assertEqual(assignments.length, 3);
  assertDeep(assignments.map((a) => a.offset), [1, 2, 3]);
  assertDeep(unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`), ['S4:coach over capacity', 'S5:coach over capacity']);
  assertEqual(REASONS.COACH_OVER_CAPACITY, 'coach over capacity');
});

// ---- §4.2 / §7.1 expansion ----

group('§4.2 — cadence and appointments');

const CADENCE_QUOTAS = computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 0.5 }, 8, slotCountsOf(FIXTURE_SLOTS));
const CADENCE_RUN = schedule(students(8), FIXTURE_SLOTS, 'auto', CADENCE_QUOTAS);
const APPOINTMENTS = expandToAppointments(CADENCE_RUN.assignments, START_MONDAY);

test('offsets map to weeks {1,5,9,13} / {2,6,10,14} / {3,7,11,15}', () => {
  assertDeep(weeksForOffset(1), [1, 5, 9, 13]);
  assertDeep(weeksForOffset(2), [2, 6, 10, 14]);
  assertDeep(weeksForOffset(3), [3, 7, 11, 15]);
});

test('no appointment falls in week 4, 8 or 12', () => {
  const bad = APPOINTMENTS.filter((r) => [4, 8, 12].includes(r.weekNumber));
  assertEqual(bad.length, 0, `found ${bad.length} appointments in weeks 4/8/12`);
});

test('every week number is within the 15-week term', () => {
  assert(APPOINTMENTS.every((r) => r.weekNumber >= 1 && r.weekNumber <= 15), 'week numbers are 1–15');
});

test('every assigned student has exactly 4 appointments, numbered 1–4', () => {
  const byStudent = new Map();
  APPOINTMENTS.forEach((r) => {
    if (!byStudent.has(r.contactSfId)) byStudent.set(r.contactSfId, []);
    byStudent.get(r.contactSfId).push(r.meetingNumber);
  });
  assertEqual(byStudent.size, CADENCE_RUN.assignments.length, 'one group per assigned student');
  byStudent.forEach((numbers, id) => {
    assertDeep(numbers.slice().sort(), [1, 2, 3, 4], `student ${id} should have meetings 1–4`);
  });
});

test('a student keeps the same coach, weekday and start time for all 4 meetings', () => {
  const byStudent = new Map();
  APPOINTMENTS.forEach((r) => {
    const key = `${r.coachName}|${r.day}|${r.startTime}`;
    if (!byStudent.has(r.contactSfId)) byStudent.set(r.contactSfId, key);
    assertEqual(byStudent.get(r.contactSfId), key, `student ${r.contactSfId} moved slot`);
  });
});

test('every appointment is 60 minutes with matching start/end times', () => {
  APPOINTMENTS.forEach((r) => {
    assertEqual(r.durationMins, 60, 'duration');
    const [sh, sm] = r.startTime.split(':').map(Number);
    const [eh, em] = r.endTime.split(':').map(Number);
    assertEqual(eh * 60 + em - (sh * 60 + sm), 60, `end time of ${r.startTime}`);
  });
});

test('dates are derived from the Monday of week 1 and land on the slot weekday', () => {
  const row = APPOINTMENTS.find((r) => r.weekNumber === 6 && r.day === 'Wednesday');
  if (row) {
    // 2026-09-07 + 5 weeks + 2 days (Mon→Wed) = 2026-10-14.
    assertEqual(row.date, '2026-10-14');
  }
  APPOINTMENTS.forEach((r) => {
    assertEqual(r.dateValue.getDay(), (['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'].indexOf(r.day) + 1) % 7,
      `${r.date} should be a ${r.day}`);
    const week1 = new Date(2026, 8, 7);
    const days = Math.round((r.dateValue - week1) / 86400000);
    assertEqual(days, (r.weekNumber - 1) * 7 + ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'].indexOf(r.day),
      `offset in days for week ${r.weekNumber} ${r.day}`);
  });
});

test('a Date start value is accepted as well as an ISO string', () => {
  const fromDate = expandToAppointments(CADENCE_RUN.assignments, new Date(2026, 8, 7));
  assertDeep(fromDate.map((r) => r.date), APPOINTMENTS.map((r) => r.date));
});

test('rows are sorted by date, then start time, then coach name (§7.1)', () => {
  for (let i = 1; i < APPOINTMENTS.length; i++) {
    const a = APPOINTMENTS[i - 1];
    const b = APPOINTMENTS[i];
    const key = (r) => `${r.date}|${r.startTime}|${r.coachName}`;
    assert(key(a) <= key(b), `row ${i} out of order: ${key(a)} before ${key(b)}`);
  }
});

test('appointment rows carry every §7.1 export field', () => {
  const row = APPOINTMENTS.find((r) => r.coachName === 'Coach A');
  ['studentName', 'contactSfId', 'studentEmail', 'serviceName', 'coachName', 'coachSfId', 'coachEmail',
   'startDateTime', 'endDateTime', 'meetingStatus']
    .forEach((field) => assert(field in row, `missing field "${field}"`));
  assertEqual(row.coachSfId, 'C-A');
  assertEqual(row.coachEmail, 'a@example.com');
});

test('Service Name is "Coaching 1 - Meeting N" for N = 1..4 (§7.1)', () => {
  assertEqual(serviceNameFor(1), 'Coaching 1 - Meeting 1');
  assertEqual(serviceNameFor(4), 'Coaching 1 - Meeting 4');
  APPOINTMENTS.forEach((r) => assertEqual(r.serviceName, `Coaching 1 - Meeting ${r.meetingNumber}`));
});

test('Meeting Status is always "Scheduled" (§7.1)', () => {
  assertEqual(MEETING_STATUS, 'Scheduled');
  assert(APPOINTMENTS.every((r) => r.meetingStatus === 'Scheduled'), 'every row is Scheduled');
});

// ---- §7.1 campus timezones ----

group('§7.1 — campus time zones');

test('the three campuses map to IANA zones', () => {
  assertDeep(CAMPUSES.map((c) => `${c.label}=${c.timeZone}`),
    ['London=Europe/London', 'Boston=America/New_York', 'Dubai=Asia/Dubai']);
});

test('an unknown or missing campus id falls back to London', () => {
  assertEqual(campusOrDefault('atlantis').id, 'london');
  assertEqual(campusOrDefault(null).id, 'london');
});

test('summer offsets match the required examples (§7.1)', () => {
  assertEqual(isoAt(2026, 9, 16, '12:00', 'Europe/London'), '2026-09-16T12:00:00+01:00');
  assertEqual(isoAt(2026, 9, 16, '07:00', 'America/New_York'), '2026-09-16T07:00:00-04:00');
  assertEqual(isoAt(2026, 9, 16, '07:00', 'Asia/Dubai'), '2026-09-16T07:00:00+04:00');
});

test('offsets change by themselves after each DST transition', () => {
  // The UK leaves BST on 25 Oct 2026, the US leaves EDT on 1 Nov 2026 —
  // both inside a term that starts in September, so a fixed offset would be
  // wrong for the back half of the term.
  assertEqual(isoAt(2026, 11, 4, '12:00', 'Europe/London'), '2026-11-04T12:00:00+00:00');

  assertEqual(isoAt(2026, 11, 4, '07:00', 'Asia/Dubai'), '2026-11-04T07:00:00+04:00', 'Dubai never shifts');
});

test('the exported wall clock matches the naive slot time in every campus', () => {

test('a meeting spanning the clocks-go-back hour keeps a true 60 minutes', () => {
  // 01:30 on 25 Oct 2026 exists twice in London; the run resolves to the

group('§11.3 — redistribution order');

// One coach, two weekday slots, so each resolution step can be forced.
const BLOCK_SLOTS = buildSlots(
  [avail('Coach A', 'Monday', '09:00', '10:00', 'C-A', 'a@example.com'),
   avail('Coach A', 'Tuesday', '09:00', '10:00', 'C-A', 'a@example.com')],
  []
);
const MON = BLOCK_SLOTS.find((s) => s.day === 'Monday');
const TUE = BLOCK_SLOTS.find((s) => s.day === 'Tuesday');

const assign = (student, slot, offset) => ({ student, coach: slot.coach, slot, offset });
const rowsFor = (assignments) => expandToAppointments(assignments, START_MONDAY, LONDON);
const cellOf = (r) => `${r.coachName}/${r.day}/${r.startTime}/wk${r.weekNumber}`;
const findRow = (rows, id, meeting) => rows.find((r) => r.contactSfId === id && r.meetingNumber === meeting);

test('(1) a displaced meeting keeps its day and time in another week of the block', () => {
  const [s1] = students(1);
  const rows = rowsFor([assign(s1, MON, 1)]); // weeks 1, 5, 9, 13
  const { appointments, exceptions, movedCount } = applyBlocks(rows, [{ coach: 'Coach A', week: 1 }], BLOCK_SLOTS);
  assertEqual(exceptions.length, 0);
  assertEqual(movedCount, 1);
  const moved = findRow(appointments, 'S1', 1);
  assertEqual(cellOf(moved), 'Coach A/Monday/09:00/wk2', 'same slot, next week of block 1');
  assertEqual(moved.rescheduledFromWeek, 1);
  assertEqual(moved.date, '2026-09-14', 'week 2 Monday');
  assertEqual(moved.startDateTime, '2026-09-14T09:00:00+01:00', 'the export instant moves with the row');
});

test('(1) earlier weeks of the block are tried first', () => {
  const [s1] = students(1);
  const rows = rowsFor([assign(s1, MON, 3)]); // weeks 3, 7, 11, 15
  const { appointments } = applyBlocks(rows, [{ coach: 'Coach A', week: 3 }], BLOCK_SLOTS);
  assertEqual(cellOf(findRow(appointments, 'S1', 1)), 'Coach A/Monday/09:00/wk1', 'week 1 before week 2');
});

test('(1) weeks whose (slot, week) is occupied are skipped', () => {
  const [s1, s2] = students(2);
  const rows = rowsFor([assign(s1, MON, 1), assign(s2, MON, 2)]); // week 2 is s2's
  const { appointments, exceptions } = applyBlocks(rows, [{ coach: 'Coach A', week: 1 }], BLOCK_SLOTS);
  assertEqual(exceptions.length, 0);
  assertEqual(cellOf(findRow(appointments, 'S1', 1)), 'Coach A/Monday/09:00/wk3');
  assertEqual(cellOf(findRow(appointments, 'S2', 1)), 'Coach A/Monday/09:00/wk2', 'the occupying meeting does not move');
  assertEqual(findRow(appointments, 'S2', 1).rescheduledFromWeek, '', 'an unmoved row carries no from-week');
});

test('(2) with the same slot full, any free (slot, week) of the coach is used — week order first', () => {
  // Tuesday 09:00 is taken in all three weeks of block 1; Monday 09:00 is free
  // in week 1 only (s4/s5 hold weeks 2 and 3).
  const [s1, s2, s3, s4, s5] = students(5);
  const rows = rowsFor([
    assign(s1, TUE, 1), assign(s2, TUE, 2), assign(s3, TUE, 3),
    assign(s4, MON, 2), assign(s5, MON, 3),
  ]);
  const blocks = [{ coach: 'Coach A', week: 1, day: 'Tuesday' }]; // a date block
  const { appointments, exceptions, movedCount } = applyBlocks(rows, blocks, BLOCK_SLOTS);
  assertEqual(exceptions.length, 0);
  assertEqual(movedCount, 1);
  const moved = findRow(appointments, 'S1', 1);
  assertEqual(cellOf(moved), 'Coach A/Monday/09:00/wk1', 'week 1 first, then the coach slot order');
  assertEqual(moved.rescheduledFromWeek, 1, 'the from-week is recorded even when the week is unchanged');
});

test('(2) the coach slot order (§4.6) picks the slot within the chosen week', () => {
  // Three slots at 09:00, 09:30, 10:00. All three offsets sit on 09:30, so
  // rule (1) has nowhere to go and rule (2) takes the first free (slot, week):
  // week 1 is blocked outright, so week 2 — and there the coach's slot order
  // puts 09:00 ahead of 10:00.
  const wide = buildSlots([avail('Coach A', 'Monday', '09:00', '11:00')], []);

  assertEqual(exceptions.length, 0);
  assertEqual(cellOf(findRow(appointments, 'S1', 1)), 'Coach A/Monday/09:00/wk2');
});

test('(3) with no free (slot, week) left in the block the meeting becomes an exception', () => {
  const [s1, s2, s3] = students(3);

});

group('§11.5 — invariants after redistribution');

// A whole week for Coach A and a single Tuesday date for Coach B, over a run
// with spare capacity (12 of the fixture's 30 places) so meetings really are
// rebooked rather than all falling through to exceptions.
const SLACK_QUOTAS = computeQuotas(['Coach A', 'Coach B'], { 'Coach A': 1, 'Coach B': 0.5 }, 12, slotCountsOf(FIXTURE_SLOTS));
const SLACK_RUN = schedule(students(12), FIXTURE_SLOTS, 'auto', SLACK_QUOTAS);
const SLACK_APPOINTMENTS = expandToAppointments(SLACK_RUN.assignments, START_MONDAY, LONDON);

const BLOCKED_DATE = '2026-10-13'; // Tuesday of week 6
const RESOLVED_DATE = weekAndDayForDate(BLOCKED_DATE, START_MONDAY);
const RUN_BLOCKS = [
  { coach: 'Coach A', week: 1 },
  { coach: 'Coach B', week: RESOLVED_DATE.week, day: RESOLVED_DATE.day },
];
const BLOCKED_RUN = applyBlocks(SLACK_APPOINTMENTS, RUN_BLOCKS, FIXTURE_SLOTS, { timeZone: LONDON, startMonday: START_MONDAY });
const BLOCKED_ROWS = BLOCKED_RUN.appointments;
const ORIGINAL_BY_MEETING = new Map(SLACK_APPOINTMENTS.map((r) => [`${r.contactSfId}|${r.meetingNumber}`, r]));

test('the run really is disturbed (otherwise the assertions below prove nothing)', () => {
  assert(BLOCKED_RUN.movedCount > 0, `expected some meetings to move, moved ${BLOCKED_RUN.movedCount}`);
  assertEqual(RESOLVED_DATE.day, 'Tuesday');
});

test('no appointment lands on a blocked coach-week or coach-date', () => {
  BLOCKED_ROWS.forEach((r) => {
    RUN_BLOCKS.forEach((b) => {
      const hit = b.coach === r.coachName && b.week === r.weekNumber && (!b.day || b.day === r.day);
      assert(!hit, `${r.contactSfId} still sits on a blocked cell: ${cellOf(r)}`);

});

test('every moved appointment keeps its coach and stays inside its original block', () => {
  const moved = BLOCKED_ROWS.filter((r) => r.rescheduledFromWeek !== '');

    assertEqual(r.rescheduledFromWeek, original.weekNumber, 'from-week is the week it left');
    assertEqual(blockOfWeek(r.weekNumber), blockOfWeek(original.weekNumber), `${r.contactSfId} left its block`);
    assertEqual(r.meetingNumber, blockOfWeek(r.weekNumber), 'meeting N stays in block N');
    assertEqual(r.serviceName, serviceNameFor(r.meetingNumber));
  });
});

test('unmoved appointments are untouched and carry a blank Rescheduled From Week', () => {
  BLOCKED_ROWS.filter((r) => r.rescheduledFromWeek === '').forEach((r) => {

test('no appointment overlaps a class block after redistribution', () => {

    assertEqual(Date.parse(r.endDateTime) - Date.parse(r.startDateTime), 60 * 60 * 1000, 'still 60 minutes');

test('a coach blocked for a whole block yields exactly one exception per affected student', () => {
  // Coach A is full (15 students across 5 slots), so every block-3 meeting of
  // theirs is displaced with nowhere to go.
  const blocks = [9, 10, 11].map((week) => ({ coach: 'Coach A', week }));
  const { appointments, exceptions } = applyBlocks(FULL_APPOINTMENTS, blocks, FIXTURE_SLOTS);

  const coachAStudents = new Set(FULL_APPOINTMENTS.filter((r) => r.coachName === 'Coach A').map((r) => r.contactSfId));
  assert(coachAStudents.size > 0, 'Coach A has students');
  assertEqual(exceptions.length, coachAStudents.size, 'exactly one exception per affected student');

  const perStudent = new Map();
  exceptions.forEach((e) => {
    assertEqual(e.block, 3);
    assertEqual(e.meetingNumber, 3);
    assertEqual(e.reason, 'no free slot in block 3 — coach blocked');
    assert(coachAStudents.has(e.student.contactSfId), 'only Coach A students are affected');
    perStudent.set(e.student.contactSfId, (perStudent.get(e.student.contactSfId) || 0) + 1);
  });
  perStudent.forEach((count, id) => assertEqual(count, 1, `student ${id} should have one exception`));

  coachAStudents.forEach((id) => {
    const kept = appointments.filter((r) => r.contactSfId === id);
    assertEqual(kept.length, 3, `student ${id} keeps their other three meetings`);
    assertDeep(kept.map((r) => blockOfWeek(r.weekNumber)).sort(), [1, 2, 4]);
  });

  const coachBRows = appointments.filter((r) => r.coachName === 'Coach B');
  assert(coachBRows.every((r) => r.rescheduledFromWeek === ''), 'Coach B is untouched');
});

group('§3.1 — class block validation');

// The parser's sheet-level entry points take an array-of-arrays (row 1 =
// headers), which is exactly what SheetJS hands them, so these exercise the
// real validation rules without needing a workbook.
const CLASS_HEADERS = ['Class Block', 'Day', 'Start Time', 'End Time', 'Class Name'];
const STUDENT_HEADERS = ['Contact SF ID', 'Student Name', 'Student Email', 'Class Block'];

/** Five 3-hour weekday classes for one block = exactly 15 hours. */
const fifteenHourRows = (block, start = '09:00', end = '12:00') =>
  ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'].map((day) => [block, day, start, end, 'Class']);

const parseClasses = (rows) => parseClassScheduleSheet('classes.xlsx', [CLASS_HEADERS, ...rows]);
const parseStudents = (rows) => parseStudentListSheet('students.xlsx', [STUDENT_HEADERS, ...rows]);
const messages = (issues) => issues.map((issue) => issue.message).join('\n');

test('a class block totalling exactly 15 hours is accepted', () => {
  const result = parseClasses(fifteenHourRows('Block A'));
  assertDeep(result.errors, [], messages(result.errors));
  assertEqual(result.rows.length, 5);
  const blocks = buildClassBlocks(result.rows);
  assertEqual(blocks.length, 1);
  assertEqual(blocks[0].minutes, CLASS_BLOCK_TOTAL_MINUTES);
  assertEqual(blocks[0].hours, 15);
});

test('several class blocks can coexist in one run, each with its own 15 hours', () => {
  const result = parseClasses([...fifteenHourRows('Block A'), ...fifteenHourRows('Block B', '13:00', '16:00')]);
  assertDeep(result.errors, [], messages(result.errors));
  const blocks = buildClassBlocks(result.rows);
  assertDeep(blocks.map((b) => `${b.name}=${b.hours}`), ['Block A=15', 'Block B=15']);
});

test('a class block totalling less than 15 hours is rejected, naming the block and its total', () => {
  const rows = fifteenHourRows('Block A').slice(0, 4); // 12 hours
  const result = parseClasses(rows);
  assertEqual(result.errors.length, 1, messages(result.errors));
  assert(result.errors[0].message.includes('"Block A"'), 'the message names the block');
  assert(result.errors[0].message.includes('12 hours'), `the message states the total: ${result.errors[0].message}`);
  assert(result.errors[0].message.includes('3 hours short of'), result.errors[0].message);
});

test('a class block totalling more than 15 hours is rejected the same way', () => {
  const rows = [...fifteenHourRows('Block A'), ['Block A', 'Saturday', '09:00', '11:30', 'Extra']]; // 17.5 hours
  const result = parseClasses(rows);
  assertEqual(result.errors.length, 1, messages(result.errors));
  assert(result.errors[0].message.includes('17.5 hours'), result.errors[0].message);
  assert(result.errors[0].message.includes('2.5 hours over'), result.errors[0].message);
});

test('one bad block is reported without condemning the good one', () => {
  const result = parseClasses([...fifteenHourRows('Block A'), ...fifteenHourRows('Block B').slice(0, 3)]);
  assertEqual(result.errors.length, 1);
  assert(result.errors[0].message.includes('"Block B"'), result.errors[0].message);
});

test('a class row with no class block name is a row error', () => {
  const rows = fifteenHourRows('Block A');
  rows[2][0] = '';
  const result = parseClasses(rows);
  assert(result.errors.some((e) => e.row === 4 && e.message.includes('Missing Class Block')), messages(result.errors));
});

test('a class row naming two blocks at once is rejected', () => {
  const rows = fifteenHourRows('Block A');
  rows[0][0] = 'Block A, Block B';
  const result = parseClasses(rows);
  assert(result.errors.some((e) => e.message.includes('names more than one class block')), messages(result.errors));
});

test('a missing Class Block column rejects the file', () => {
  const result = parseClassScheduleSheet('classes.xlsx', [
    ['Day', 'Start Time', 'End Time'],
    ['Monday', '09:00', '12:00'],
  ]);
  assertDeep(result.errors.map((e) => e.message), ['Missing required column "Class Block".']);
});

test('two overlapping classes in the same block are an error; the same hour in another block is not', () => {
  const clash = parseClasses([
    ['Block A', 'Monday', '09:00', '12:00', 'One'],
    ['Block A', 'Monday', '11:00', '13:00', 'Two'],
    ['Block A', 'Tuesday', '09:00', '19:00', 'Three'],
  ]);
  assert(clash.errors.some((e) => e.message.includes('overlapping classes on Monday')), messages(clash.errors));

  const parallel = parseClasses([...fifteenHourRows('Block A'), ...fifteenHourRows('Block B')]);
  assertDeep(parallel.errors, [], 'the same hours in two different blocks are normal');
});

test('existing class time rules still apply (day names, end after start)', () => {
  const result = parseClasses([
    ['Block A', 'Someday', '09:00', '12:00', ''],
    ['Block A', 'Monday', '12:00', '09:00', ''],
  ]);
  assert(result.errors.some((e) => e.message.includes('Unknown day name "Someday"')), messages(result.errors));
  assert(result.errors.some((e) => e.message.includes('End Time must be after Start Time')), messages(result.errors));
});

test('the student list requires a class block on every student', () => {
  const ok = parseStudents([['S1', 'Jane Doe', 'jane@example.com', 'Block A']]);
  assertDeep(ok.errors, [], messages(ok.errors));
  assertEqual(ok.rows[0].classBlock, 'Block A');

  const blank = parseStudents([['S1', 'Jane Doe', 'jane@example.com', '']]);
  assert(blank.errors.some((e) => e.message.includes('Missing Class Block')), messages(blank.errors));

  const missingColumn = parseStudentListSheet('students.xlsx', [
    ['Contact SF ID', 'Student Name', 'Student Email'],
    ['S1', 'Jane Doe', 'jane@example.com'],
  ]);
  assertDeep(missingColumn.errors.map((e) => e.message), ['Missing required column "Class Block".']);
});

test('a student cannot belong to two class blocks at once', () => {
  const result = parseStudents([['S1', 'Jane Doe', 'jane@example.com', 'Block A / Block B']]);
  assert(result.errors.some((e) => e.message.includes('names more than one class block')), messages(result.errors));
  assertEqual(result.rows.length, 0, 'the ambiguous row is not scheduled from');
});

test('a student naming an unknown class block is warned about, listing the real blocks', () => {
  const blocks = buildClassBlocks(parseClasses([...fifteenHourRows('Block A'), ...fifteenHourRows('Block B')]).rows);
  const rows = parseStudents([
    ['S1', 'Jane Doe', 'jane@example.com', 'Block A'],
    ['S2', 'Sam Patel', 'sam@example.com', 'Block Z'],
  ]).rows;
  const warnings = checkStudentClassBlocks('students.xlsx', rows, blocks);
  assertEqual(warnings.length, 1);
  assertEqual(warnings[0].row, 3);
  assert(warnings[0].message.includes('"Block Z" is not in the class schedule'), warnings[0].message);
  assert(warnings[0].message.includes('Block A, Block B'), warnings[0].message);
});

test('class block names match case-insensitively after trimming', () => {
  assertEqual(classBlockKey('  Block A '), 'block a');
  const blocks = buildClassBlocks([
    { classBlock: 'Block A', day: 'Monday', start: t('09:00'), end: t('10:00') },
    { classBlock: ' block a ', day: 'Tuesday', start: t('09:00'), end: t('10:00') },
  ]);
  assertEqual(blocks.length, 1, 'one cohort, spelled two ways');
  assertEqual(blocks[0].hours, 2);
});

// ---- §4.4a student-specific class clashes ----

group('§4.4a — student-specific class clashes');

// Coach A is free Monday 09:00–12:00 → 09:00, 09:30, 10:00, 10:30, 11:00.
// Block A has a class 09:00–10:00 (rules out 09:00 and 09:30 for its students).
// Block B has a class 11:00–12:00 (rules out 10:30 and 11:00 for its students).
// 10:00 is the only window both cohorts can use, and no window is dead.
const MB_CLASSES = [
  { classBlock: 'Block A', day: 'Monday', start: t('09:00'), end: t('10:00'), className: 'A maths' },
  { classBlock: 'Block B', day: 'Monday', start: t('11:00'), end: t('12:00'), className: 'B physics' },
];
const MB_AVAILABILITY = [avail('Coach A', 'Monday', '09:00', '12:00', 'C-A', 'a@example.com')];
const MB_SLOTS = buildSlots(MB_AVAILABILITY, MB_CLASSES);
const MB_BLOCKS = buildClassBlocks(MB_CLASSES);

const studentsIn = (n, block, prefix = 'S') =>
  students(n, prefix).map((student) => ({ ...student, classBlock: block }));

const startsFor = (block) => slotsForClassBlock(MB_SLOTS, block).map((s) => minutesToTime(s.start));

test('a class in one block no longer removes the slot for everybody', () => {
  assertDeep(MB_SLOTS.map((s) => minutesToTime(s.start)), ['09:00', '09:30', '10:00', '10:30', '11:00']);
  assertEqual(MB_SLOTS.length, buildSlots(MB_AVAILABILITY, []).length,
    'a coach loses no capacity because one cohort has a class then');
});

test('each slot records exactly which class blocks it clashes with', () => {
  const byStart = Object.fromEntries(MB_SLOTS.map((s) => [minutesToTime(s.start), s.blockedFor.join(',')]));
  assertDeep(byStart, {
    '09:00': 'block a', '09:30': 'block a', '10:00': '', '10:30': 'block b', '11:00': 'block b',
  });
  assert(slotAllowsClassBlock(MB_SLOTS[0], 'Block B'), '09:00 is fine for Block B');
  assert(!slotAllowsClassBlock(MB_SLOTS[0], 'Block A'), '09:00 clashes with Block A');
});

test('a window every class block blocks is dropped as unusable', () => {
  const slots = buildSlots(MB_AVAILABILITY, [
    ...MB_CLASSES,
    { classBlock: 'Block A', day: 'Monday', start: t('10:00'), end: t('11:00') },
    { classBlock: 'Block B', day: 'Monday', start: t('10:00'), end: t('11:00') },
  ]);
  assertDeep(slots.map((s) => minutesToTime(s.start)), ['09:00', '11:00'],
    '09:30–10:30 are now blocked for both cohorts');
});

test('a student in block A can take a slot that overlaps block B classes', () => {
  assertDeep(startsFor('Block A'), ['10:00', '10:30', '11:00']);
  const { assignments, unassigned } = schedule(studentsIn(1, 'Block A'), MB_SLOTS, 'auto', { 'Coach A': 5 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  assertEqual(unassigned.length, 0);
  assertEqual(slotLabel(assignments[0].slot), 'Coach A/Monday/10:00');

  // With 10:00 and 10:30 taken by earlier students, block A's fourth student
  // lands on 11:00 — squarely inside block B's class, and legitimately so.
  const many = schedule(studentsIn(7, 'Block A'), MB_SLOTS, 'auto', { 'Coach A': 15 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  assertEqual(many.unassigned.length, 0);
  assertDeep(many.assignments.map((a) => `${minutesToTime(a.slot.start)}#${a.offset}`),
    ['10:00#1', '10:00#2', '10:00#3', '10:30#1', '10:30#2', '10:30#3', '11:00#1']);
});

test('a student is never scheduled during a class in their own block', () => {
  const all = [...studentsIn(6, 'Block A', 'A'), ...studentsIn(6, 'Block B', 'B')];
  const { assignments, unassigned } = schedule(all, MB_SLOTS, 'auto', { 'Coach A': 15 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  assertEqual(unassigned.length, 0);
  assignments.forEach((a) => {
    assert(slotAllowsClassBlock(a.slot, a.student.classBlock),
      `${a.student.contactSfId} (${a.student.classBlock}) was put at ${minutesToTime(a.slot.start)}`);
  });
  assertDeep(startsFor('Block B'), ['09:00', '09:30', '10:00']);
});

test('appointments never overlap a class in the student own block, and may overlap another block', () => {
  const all = [...studentsIn(7, 'Block A', 'A'), ...studentsIn(6, 'Block B', 'B')];
  const { assignments } = schedule(all, MB_SLOTS, 'auto', { 'Coach A': 15 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  const rows = expandToAppointments(assignments, START_MONDAY, LONDON);
  assertEqual(rows.length, 52);
  rows.forEach((row) => {
    MB_CLASSES.forEach((cls) => {
      const clash = cls.day === row.day && cls.start < t(row.endTime) && t(row.startTime) < cls.end;
      if (classBlockKey(cls.classBlock) === classBlockKey(row.classBlock)) {
        assert(!clash, `${row.contactSfId} clashes with their own class at ${row.startTime}`);
      }
    });
    assertEqual(row.classBlock, row.contactSfId.startsWith('A') ? 'Block A' : 'Block B');
  });
  assert(rows.some((row) => row.classBlock === 'Block A' && row.startTime === '11:00'),
    'a block A meeting really does sit inside block B class time');
});

test('a coach capacity counts every slot a cohort could use, not just the universally free ones', () => {
  const counts = { 'Coach A': MB_SLOTS.length };
  assertDeep(computeQuotas(['Coach A'], { 'Coach A': 1 }, 15, counts), { 'Coach A': 15 },
    '5 slots × 3 offsets, undiminished by either cohort class');
});

test('a student whose class block leaves no free place is told so, not called a capacity problem', () => {
  // Block B can only use 09:00, 09:30 and 10:00 — nine places. The tenth
  // block B student has nowhere to go while block A places remain.
  const all = [...studentsIn(9, 'Block B', 'B'), ...studentsIn(1, 'Block B', 'X')];
  const { assignments, unassigned } = schedule(all, MB_SLOTS, 'auto', { 'Coach A': 15 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  assertEqual(assignments.length, 9);
  assertDeep(unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`), ['X1:no free slot outside their class block']);
  assertEqual(REASONS.CLASS_CLASH, 'no free slot outside their class block');
});

test('a student with no class block, or an unknown one, is never scheduled', () => {
  const all = [
    { contactSfId: 'S1', studentName: 'Has one', studentEmail: 's1@example.com', classBlock: 'Block A' },
    { contactSfId: 'S2', studentName: 'Has none', studentEmail: 's2@example.com', classBlock: '' },
    { contactSfId: 'S3', studentName: 'Has a ghost', studentEmail: 's3@example.com', classBlock: 'Block Z' },
    { contactSfId: 'S4', studentName: 'Has no field', studentEmail: 's4@example.com' },
  ];
  const { assignments, unassigned } = schedule(all, MB_SLOTS, 'auto', { 'Coach A': 15 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  assertDeep(assignments.map((a) => a.student.contactSfId), ['S1']);
  assertDeep(unassigned.map((u) => `${u.student.contactSfId}:${u.reason}`),
    ['S2:no class block', 'S3:class block not found', 'S4:no class block']);
  assertEqual(REASONS.NO_CLASS_BLOCK, 'no class block');
  assertEqual(REASONS.CLASS_BLOCK_NOT_FOUND, 'class block not found');
});

test('pre-allocated mode honours the student class block too', () => {
  const twoCoaches = buildSlots([
    avail('Coach A', 'Monday', '09:00', '12:00', 'C-A', 'a@example.com'),
    avail('Coach B', 'Monday', '09:00', '12:00', 'C-B', 'b@example.com'),
  ], MB_CLASSES);
  const all = [...studentsIn(2, 'Block A', 'A'), ...studentsIn(2, 'Block B', 'B')];
  const pairings = all.map((s) => ({ contactSfId: s.contactSfId, coachName: s.contactSfId.startsWith('A') ? 'Coach A' : 'Coach B' }));
  const { assignments, unassigned } = schedule(all, twoCoaches, 'pre-allocated', pairings, ['Coach A', 'Coach B'], { classBlocks: MB_BLOCKS });
  assertEqual(unassigned.length, 0);
  assertDeep(assignments.map((a) => `${a.student.contactSfId}→${slotLabel(a.slot)}#${a.offset}`), [
    'A1→Coach A/Monday/10:00#1', 'A2→Coach A/Monday/10:00#2',
    'B1→Coach B/Monday/09:00#1', 'B2→Coach B/Monday/09:00#2',
  ]);
});

test('pre-allocated overflow is still "coach over capacity", not a class clash', () => {
  const slots = buildSlots([avail('Coach A', 'Monday', '09:00', '10:00')], []);
  const all = studentsIn(4, 'Block A');
  const pairings = all.map((s) => ({ contactSfId: s.contactSfId, coachName: 'Coach A' }));
  const { unassigned } = schedule(all, slots, 'pre-allocated', pairings, ['Coach A'],
    { classBlocks: [{ classBlock: 'Block A', day: 'Sunday', start: t('09:00'), end: t('10:00') }] });
  assertDeep(unassigned.map((u) => u.reason), [REASONS.COACH_OVER_CAPACITY]);
});

test('scheduling with class blocks is deterministic', () => {
  const all = [...studentsIn(5, 'Block A', 'A'), ...studentsIn(5, 'Block B', 'B')];
  const shape = (r) => ({
    assignments: r.assignments.map((a) => `${a.student.contactSfId}|${slotLabel(a.slot)}|${a.offset}`),
    unassigned: r.unassigned.map((u) => `${u.student.contactSfId}|${u.reason}`),
  });
  const run = () => schedule(all, MB_SLOTS, 'auto', { 'Coach A': 15 }, ['Coach A'], { classBlocks: MB_BLOCKS });
  assertDeep(shape(run()), shape(run()));
});

test('a run with a single class block behaves exactly as the old shared timetable did', () => {
  const oneBlock = [
    { classBlock: 'Block A', day: 'Monday', start: t('10:00'), end: t('11:00') },
    { classBlock: 'Block A', day: 'Wednesday', start: t('09:00'), end: t('10:00') },
  ];
  const slots = buildSlots(FIXTURE_AVAILABILITY, oneBlock);
  assertDeep(slots.map(slotLabel), FIXTURE_SLOTS.map(slotLabel),
    'the same classes, now named as one block, remove the same windows');
});

test('displaced meetings are never rebooked onto the student own class (§11.3)', () => {
  // Coach A holds only 10:30 and 11:00 on Monday, both barred for block B.
  const slots = buildSlots(MB_AVAILABILITY, MB_CLASSES).filter((s) => minutesToTime(s.start) >= '10:00');
  const [a1] = studentsIn(1, 'Block A', 'A');
  const [b1] = studentsIn(1, 'Block B', 'B');
  const at = (student, slot, offset) => ({ student, coach: slot.coach, slot, offset });
  const ten = slots.find((s) => minutesToTime(s.start) === '10:00');
  const rows = expandToAppointments([at(a1, ten, 1), at(b1, ten, 2)], START_MONDAY, LONDON);

  const { appointments, exceptions } = applyBlocks(rows, [{ coach: 'Coach A', week: 1 }, { coach: 'Coach A', week: 2 }], slots);

  const blockA = appointments.filter((r) => r.contactSfId === 'A1' && r.weekNumber <= 3);
  assertEqual(blockA.length, 1, 'the block A student is rebooked somewhere');
  const blockB = appointments.filter((r) => r.contactSfId === 'B1' && r.weekNumber <= 3);
  assertEqual(blockB.length + exceptions.filter((e) => e.student.contactSfId === 'B1').length, 1);
  appointments.forEach((row) => {
    MB_CLASSES.forEach((cls) => {
      if (classBlockKey(cls.classBlock) !== classBlockKey(row.classBlock)) return;
      const clash = cls.day === row.day && cls.start < t(row.endTime) && t(row.startTime) < cls.end;
      assert(!clash, `${row.contactSfId} was rebooked into their own class at ${row.startTime}`);
    });
  });
});

// ---- render ----

const list = document.getElementById('results');
const summary = document.getElementById('summary');
let lastGroup = null;
let passed = 0;

results.forEach((result) => {
  if (result.group !== lastGroup) {
    lastGroup = result.group;
    const heading = document.createElement('li');
    heading.className = 'test-group';
    heading.textContent = result.group;
    list.appendChild(heading);
  }
  if (result.ok) passed += 1;
  const item = document.createElement('li');
  item.className = result.ok ? 'pass' : 'fail';
  const badge = document.createElement('span');
  badge.className = 'badge';
  badge.textContent = result.ok ? 'PASS' : 'FAIL';
  item.appendChild(badge);
  item.appendChild(document.createTextNode(result.name));
  if (!result.ok) {
    const detail = document.createElement('span');
    detail.className = 'detail';
    detail.textContent = result.detail;
    item.appendChild(detail);
  }
  list.appendChild(item);
});

const failed = results.length - passed;
summary.className = `test-summary ${failed === 0 ? 'pass' : 'fail'}`;
summary.textContent = failed === 0
  ? `All ${results.length} tests passed.`
  : `${failed} of ${results.length} tests failed.`;
document.title = `${failed === 0 ? 'PASS' : 'FAIL'} — Scheduler tests`;
</script>
